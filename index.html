<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Holic 홀덤 매니저</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" as="style" crossorigin href="[https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css](https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css)" />
  <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap)" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            slate: {
              850: '#172033',
              920: '#0b1120',
              950: '#060a13',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #090d16;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
    .felt-surface {
      background: radial-gradient(ellipse at center, #134e3a 0%, #0b3326 68%, #072219 100%);
      box-shadow: inset 0 0 36px rgba(0, 0, 0, 0.65);
    }
    .table-rail {
      background: linear-gradient(145deg, #272018 0%, #161310 55%, #231c15 100%);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(251, 191, 36, 0.25);
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
  <div id="app" class="max-w-xl mx-auto px-4 py-6 pb-20"></div>

  <script>
    const DEFAULT_REGULAR_MEMBERS = [
      '민석', '민겸', '서이', '진겸', '윤범', '민중', '주광', '동준', '미림',
      '중훈', '나윤', '재호', '한빈', '선수', '태현', '윤아', '영모'
    ];

    const STORAGE_KEYS = {
      regulars: 'holic_regular_members_v1',
      selected: 'holic_selected_members_v1',
      guests: 'holic_guest_members_v1'
    };

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function saveJSON(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {}
    }

    const state = {
      activeTab: 'seats', // 'seats' | 'dealerFee' | 'manjing'
      regularMembers: loadJSON(STORAGE_KEYS.regulars, DEFAULT_REGULAR_MEMBERS),
      guestMembers: loadJSON(STORAGE_KEYS.guests, []),
      selectedMembers: loadJSON(STORAGE_KEYS.selected, ['민석', '민겸', '서이', '진겸', '중훈', '나윤']),
      newRegularInput: '',
      newGuestInput: '',

      // 자리뽑기 상태
      dealerMode: 'random', // 'random' | 'manual'
      manualDealer: '',
      dealerName: '',
      seatAssignments: [], // [{ seatLabel: 'D' | '1번' ..., name: '', isDealer: bool }]

      // 딜러비 추첨 상태 (회차 누적 없이 추첨 후 종료)
      dealerFeeWinners: [],
      dealerFeeDone: false,

      // 맨징 계산기 상태
      totalPool: 0,
      roundTo100: true,
      players: [],
      lastSyncedSignature: '',
      copiedText: false,
      exportingImage: false,
      statusMessage: ''
    };

    function getAllAttendees() {
      const combined = [...state.selectedMembers, ...state.guestMembers];
      return [...new Set(combined)].filter(name => name && name.trim());
    }

    function syncManjingPlayers(force = false) {
      const attendees = getAllAttendees();
      const signature = attendees.join('|');
      if (!force && signature === state.lastSyncedSignature && state.players.length === attendees.length) {
        return;
      }
      const existingMap = new Map(state.players.map(p => [p.name, p]));
      state.players = attendees.map((name, idx) => {
        const prev = existingMap.get(name);
        return {
          id: prev ? prev.id : idx + 1,
          name,
          loss: prev ? prev.loss : 0
        };
      });
      state.lastSyncedSignature = signature;
    }

    function formatNumber(num) {
      const n = Number(num) || 0;
      return n.toLocaleString('ko-KR');
    }

    function parseDigits(val) {
      const cleaned = String(val || '').replace(/[^0-9]/g, '');
      return cleaned ? parseInt(cleaned, 10) : 0;
    }

    function roundSettlement(amount, roundTo100) {
      if (!roundTo100) return Math.round(amount);
      return Math.round(amount / 100) * 100;
    }

    function showToast(msg) {
      state.statusMessage = msg;
      render();
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        state.statusMessage = '';
        render();
      }, 2200);
    }

    function persistMemberState() {
      saveJSON(STORAGE_KEYS.regulars, state.regularMembers);
      saveJSON(STORAGE_KEYS.guests, state.guestMembers);
      saveJSON(STORAGE_KEYS.selected, state.selectedMembers);
      syncManjingPlayers(true);

      // 참석자 변경 시 기존 추첨·자리 결과 정합성 유지
      const attendees = getAllAttendees();
      if (state.manualDealer && !attendees.includes(state.manualDealer)) {
        state.manualDealer = attendees[0] || '';
      }
      if (state.seatAssignments.length > 0) {
        const currentSeatNames = state.seatAssignments.map(s => s.name);
        const sameSet =
          currentSeatNames.length === attendees.length &&
          attendees.every(a => currentSeatNames.includes(a));
        if (!sameSet) {
          state.seatAssignments = [];
          state.dealerName = '';
        }
      }
      if (state.dealerFeeWinners.length > 0) {
        const invalidWinner = state.dealerFeeWinners.some(w => !attendees.includes(w) || w === state.dealerName);
        if (invalidWinner) {
          state.dealerFeeWinners = [];
          state.dealerFeeDone = false;
        }
      }
    }

    function toggleAttendee(name) {
      if (state.guestMembers.includes(name)) {
        state.guestMembers = state.guestMembers.filter(g => g !== name);
      } else if (state.selectedMembers.includes(name)) {
        state.selectedMembers = state.selectedMembers.filter(m => m !== name);
      } else {
        state.selectedMembers = [...state.selectedMembers, name];
      }
      persistMemberState();
      render();
    }

    function addRegularMember() {
      const trimmed = state.newRegularInput.trim();
      if (!trimmed) return;
      if (state.regularMembers.includes(trimmed)) {
        showToast('이미 단골 멤버에 등록된 이름입니다.');
        return;
      }
      state.regularMembers = [...state.regularMembers, trimmed];
      state.selectedMembers = [...new Set([...state.selectedMembers, trimmed])];
      state.newRegularInput = '';
      persistMemberState();
      showToast(`단골 멤버 '${trimmed}' 추가 완료!`);
    }

    function addGuestMember() {
      const trimmed = state.newGuestInput.trim();
      if (!trimmed) return;
      const allKnown = [...state.regularMembers, ...state.guestMembers];
      if (allKnown.includes(trimmed)) {
        if (!state.selectedMembers.includes(trimmed) && state.regularMembers.includes(trimmed)) {
          state.selectedMembers = [...state.selectedMembers, trimmed];
          persistMemberState();
          showToast(`'${trimmed}' 님을 오늘 참석자에 체크했습니다.`);
          return;
        }
        showToast('이미 참가자 목록에 있는 이름입니다.');
        return;
      }
      state.guestMembers = [...state.guestMembers, trimmed];
      state.newGuestInput = '';
      persistMemberState();
      showToast(`추가 참가자 '${trimmed}' 등록 완료!`);
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // 딜러 자리 다음 좌석부터 1번, 시계방향 순번 배정
    function drawSeats() {
      const attendees = getAllAttendees();
      if (attendees.length < 2) {
        showToast('자리뽑기를 하려면 최소 2명 이상 참석해야 합니다.');
        return;
      }

      let chosenDealer = '';
      if (state.dealerMode === 'manual') {
        chosenDealer = attendees.includes(state.manualDealer) ? state.manualDealer : attendees[0];
      } else {
        chosenDealer = attendees[Math.floor(Math.random() * attendees.length)];
      }

      const others = shuffleArray(attendees.filter(name => name !== chosenDealer));
      const assignments = [
        {
          seatNumber: 0,
          seatLabel: '딜러 (D)',
          name: chosenDealer,
          isDealer: true
        },
        ...others.map((name, idx) => ({
          seatNumber: idx + 1,
          seatLabel: `${idx + 1}번`,
          name,
          isDealer: false
        }))
      ];

      state.dealerName = chosenDealer;
      state.seatAssignments = assignments;

      // 딜러가 바뀌면 기존 딜러비 추첨 결과 초기화
      state.dealerFeeWinners = [];
      state.dealerFeeDone = false;
      render();
    }

    // 매 라운드 종료 후 딜러 제외 랜덤 2명 추첨 (회차 기록 없이 단발 종료)
    function drawDealerFeeWinners() {
      const attendees = getAllAttendees();
      const eligible = attendees.filter(name => name !== state.dealerName);

      if (eligible.length < 2) {
        showToast('딜러 제외 대상 인원이 2명 이상이어야 추첨할 수 있습니다.');
        return;
      }

      const winners = shuffleArray(eligible).slice(0, 2);
      state.dealerFeeWinners = winners;
      state.dealerFeeDone = true;
      render();
    }

    function resetDealerFeeRound() {
      state.dealerFeeWinners = [];
      state.dealerFeeDone = false;
      render();
    }

    function calculateManjing() {
      const pool = Math.max(0, Number(state.totalPool) || 0);
      const validPlayers = state.players.map(p => ({
        ...p,
        loss: Math.max(0, Number(p.loss) || 0)
      }));
      const totalLoss = validPlayers.reduce((sum, p) => sum + p.loss, 0);

      if (totalLoss <= 0) {
        return {
          pool,
          totalLoss: 0,
          items: validPlayers.map(p => ({
            ...p,
            ratio: 0,
            exactAmount: 0,
            settledAmount: 0
          }))
        };
      }

      const items = validPlayers.map(p => {
        const ratio = p.loss / totalLoss;
        const exactAmount = pool * ratio;
        const settledAmount = roundSettlement(exactAmount, state.roundTo100);
        return {
          ...p,
          ratio,
          exactAmount,
          settledAmount
        };
      });

      return { pool, totalLoss, items };
    }

    function buildKakaoText() {
      const { pool, totalLoss, items } = calculateManjing();
      const lines = [
        `🃏 [Holic] 홀덤 맨징 정산`,
        `• 총 맨징 금액: ${formatNumber(pool)}원`,
        `• 총 마이너스 합계: ${formatNumber(totalLoss)}원`,
        `• 반올림 기준: ${state.roundTo100 ? '100원 단위' : '원 단위'}`,
        ``
      ];

      items.forEach((item, index) => {
        const pct = (item.ratio * 100).toFixed(1);
        lines.push(
          `${index + 1}. ${item.name} — 마이너스 ${formatNumber(item.loss)}원 (${pct}%) → 맨징 ${formatNumber(item.settledAmount)}원`
        );
      });

      return lines.join('\n');
    }

    async function copySettlementText() {
      const text = buildKakaoText();
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        state.copiedText = true;
        render();
        showToast('카카오톡용 정산 내역이 복사되었습니다!');
        setTimeout(() => {
          state.copiedText = false;
          render();
        }, 2000);
      } catch {
        showToast('복사에 실패했습니다. 다시 시도해 주세요.');
      }
    }

    function exportSettlementPng() {
      state.exportingImage = true;
      render();

      const { pool, totalLoss, items } = calculateManjing();
      const width = 900;
      const rowHeight = 76;
      const height = 260 + Math.max(items.length, 1) * rowHeight;

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, width, height);
      bgGrad.addColorStop(0, '#090d16');
      bgGrad.addColorStop(1, '#111827');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = 'rgba(245, 158, 11, 0.35)';
      ctx.lineWidth = 3;
      ctx.strokeRect(24, 24, width - 48, height - 48);

      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 34px Pretendard, sans-serif';
      ctx.fillText('Holic 홀덤 맨징 정산표', 56, 86);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '22px Pretendard, sans-serif';
      ctx.fillText(
        `총 맨징: ${formatNumber(pool)}원   |   총 마이너스: ${formatNumber(totalLoss)}원   |   ${state.roundTo100 ? '100원 반올림' : '원 단위'}`,
        56,
        132
      );

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(56, 162);
      ctx.lineTo(width - 56, 162);
      ctx.stroke();

      items.forEach((item, idx) => {
        const y = 212 + idx * rowHeight;
        ctx.fillStyle = 'rgba(30, 41, 59, 0.72)';
        ctx.fillRect(56, y - 34, width - 112, 58);

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 24px Pretendard, sans-serif';
        ctx.fillText(`${idx + 1}. ${item.name}`, 76, y + 3);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '20px Pretendard, sans-serif';
        ctx.fillText(`-${formatNumber(item.loss)}원 (${(item.ratio * 100).toFixed(1)}%)`, 280, y + 3);

        ctx.fillStyle = '#34d399';
        ctx.font = 'bold 25px Pretendard, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`+${formatNumber(item.settledAmount)}원`, width - 76, y + 3);
        ctx.textAlign = 'left';
      });

      const link = document.createElement('a');
      link.download = `holic-manjing-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();

      state.exportingImage = false;
      render();
      showToast('정산 이미지(PNG)가 저장되었습니다!');
    }

    function renderPokerTable(assignments) {
      const count = assignments.length;
      if (count === 0) {
        return `
          <div class="table-rail rounded-[36px] p-3">
            <div class="felt-surface rounded-[28px] py-12 px-6 text-center border border-emerald-400/20">
              <div class="text-amber-300/90 font-semibold text-sm mb-1">HOLDEM TABLE SEAT DRAW</div>
              <p class="text-slate-200 font-bold text-base">참석 멤버를 체크한 뒤 '자리뽑기 실행'을 눌러주세요</p>
              <p class="text-emerald-200/70 text-xs mt-1.5">딜러(D) 자리 다음 좌석이 1번으로 시계방향 배정됩니다</p>
            </div>
          </div>
        `;
      }

      // 딜러(0번)를 상단 중앙에 두고 시계방향으로 좌석 배치
      const seatCoords = assignments.map((seat, idx) => {
        const angle = -Math.PI / 2 + (2 * Math.PI * idx) / count;
        const rx = 41; // % 가로 반경
        const ry = 39; // % 세로 반경
        const left = 50 + rx * Math.cos(angle);
        const top = 50 + ry * Math.sin(angle);
        return { ...seat, left, top };
      });

      return `
        <div class="table-rail rounded-[40px] p-3 sm:p-4">
          <div class="felt-surface relative w-full h-[360px] sm:h-[390px] rounded-[32px] border border-emerald-400/25 overflow-visible">
            <!-- 테이블 중앙 펠트 로고 -->
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none select-none px-4 text-center">
              <span class="text-[11px] uppercase tracking-[0.22em] text-amber-300/80 font-semibold">HOLIC TABLE</span>
              <span class="text-white/90 font-extrabold text-lg sm:text-xl mt-0.5">딜러: ${state.dealerName}</span>
              <span class="text-emerald-200/75 text-[11px] mt-1">딜러 다음 자리 → 1번 시계방향</span>
            </div>

            ${seatCoords.map(seat => `
              <div
                style="left: ${seat.left.toFixed(1)}%; top: ${seat.top.toFixed(1)}%; transform: translate(-50%, -50%);"
                class="absolute z-10 min-w-[74px] max-w-[104px] rounded-2xl px-2.5 py-2 text-center shadow-lg border transition ${
                  seat.isDealer
                    ? 'bg-amber-400 text-slate-950 border-amber-200 ring-2 ring-amber-300/60'
                    : 'bg-slate-900/95 text-white border-slate-700/90'
                }"
              >
                <div class="text-[10px] font-extrabold tracking-tight ${
                  seat.isDealer ? 'text-slate-900' : 'text-emerald-400'
                }">
                  ${seat.seatLabel}
                </div>
                <div class="text-xs sm:text-sm font-bold truncate mt-0.5">${seat.name}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function render() {
      syncManjingPlayers();
      const attendees = getAllAttendees();
      const nonDealerAttendees = attendees.filter(name => name !== state.dealerName);
      const { pool, totalLoss, items } = calculateManjing();

      const appEl = document.getElementById('app');
      appEl.innerHTML = `
        <!-- 토스트 알림 -->
        ${state.statusMessage ? `
          <div class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-800 text-amber-300 border border-amber-400/40 px-4 py-2.5 rounded-full text-xs sm:text-sm font-semibold shadow-xl">
            ${state.statusMessage}
          </div>
        ` : ''}

        <!-- 헤더 -->
        <header class="mb-5 flex items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <img
              src="icon.png"
              alt="Holic"
              onerror="this.style.display='none'"
              class="w-12 h-12 rounded-2xl object-cover border border-amber-400/40 shadow-md"
            />
            <div>
              <div class="flex items-center gap-2">
                <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-white">Holic 홀덤 매니저</h1>
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
                  참석 ${attendees.length}명
                </span>
              </div>
              <p class="text-xs text-slate-400 mt-0.5">멤버 체크 → 자리뽑기 · 딜러비 추첨 · 맨징 정산</p>
            </div>
          </div>
        </header>

        <!-- 1. 멤버 설정 섹션 -->
        <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 mb-4 shadow-lg">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-bold text-white flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-amber-400"></span>
              오늘 참석 멤버 설정
            </h2>
            <div class="flex items-center gap-2 text-xs">
              <button
                type="button"
                data-action="select-all-regulars"
                class="text-emerald-400 hover:text-emerald-300 font-semibold"
              >
                단골 전체선택
              </button>
              <span class="text-slate-600">|</span>
              <button
                type="button"
                data-action="clear-selection"
                class="text-slate-400 hover:text-slate-200"
              >
                선택해제
              </button>
            </div>
          </div>

          <!-- 단골 멤버 체크 그리드 -->
          <div class="grid grid-cols-3 sm:grid-cols-4 gap-2 mb-3">
            ${state.regularMembers.map(member => {
              const checked = state.selectedMembers.includes(member);
              return `
                <button
                  type="button"
                  data-action="toggle-member"
                  data-name="${member}"
                  class="flex items-center justify-between px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border transition ${
                    checked
                      ? 'bg-emerald-500/20 border-emerald-400 text-emerald-200 shadow-sm'
                      : 'bg-slate-950/70 border-slate-800 text-slate-400 hover:border-slate-700'
                  }"
                >
                  <span class="truncate">${member}</span>
                  <span class="ml-1 text-xs font-extrabold ${checked ? 'text-emerald-300' : 'text-slate-600'}">
                    ${checked ? '✓' : '+'}
                  </span>
                </button>
              `;
            }).join('')}
          </div>

          <!-- 오늘만 오는 추가 참가자 칩 -->
          ${state.guestMembers.length > 0 ? `
            <div class="mb-3">
              <div class="text-[11px] font-semibold text-amber-300/90 mb-1.5">오늘 추가 참가자</div>
              <div class="flex flex-wrap gap-1.5">
                ${state.guestMembers.map(guest => `
                  <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-400/15 text-amber-200 border border-amber-400/40">
                    ${guest}
                    <button
                      type="button"
                      data-action="toggle-member"
                      data-name="${guest}"
                      class="text-amber-300 hover:text-white font-bold"
                      title="제외"
                    >×</button>
                  </span>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- 단골 멤버 추가 & 추가 참가자 입력 -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-2 border-t border-slate-800/80">
            <div class="flex gap-1.5">
              <input
                type="text"
                id="newRegularInput"
                value="${state.newRegularInput}"
                placeholder="단골 멤버 이름 추가"
                class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-400 rounded-xl px-3 py-2 text-xs sm:text-sm text-white placeholder-slate-500 outline-none"
              />
              <button
                type="button"
                data-action="add-regular"
                class="shrink-0 px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-300 text-xs font-bold border border-slate-700"
              >
                단골등록
              </button>
            </div>

            <div class="flex gap-1.5">
              <input
                type="text"
                id="newGuestInput"
                value="${state.newGuestInput}"
                placeholder="처음 온 추가 참가자 입력"
                class="w-full bg-slate-950 border border-slate-800 focus:border-amber-400 rounded-xl px-3 py-2 text-xs sm:text-sm text-white placeholder-slate-500 outline-none"
              />
              <button
                type="button"
                data-action="add-guest"
                class="shrink-0 px-3 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs font-extrabold"
              >
                참가추가
              </button>
            </div>
          </div>
        </section>

        <!-- 2. 메인 3개 탭 (자리뽑기 / 딜러비 추첨 / 맨징) -->
        <nav class="grid grid-cols-3 gap-2 bg-slate-900 border border-slate-800 p-1.5 rounded-2xl mb-4">
          <button
            type="button"
            data-action="switch-tab"
            data-tab="seats"
            class="py-2.5 px-2 rounded-xl text-xs sm:text-sm font-bold transition ${
              state.activeTab === 'seats'
                ? 'bg-emerald-500 text-slate-950 shadow'
                : 'text-slate-300 hover:bg-slate-800/70'
            }"
          >
            🪑 자리뽑기
          </button>
          <button
            type="button"
            data-action="switch-tab"
            data-tab="dealerFee"
            class="py-2.5 px-2 rounded-xl text-xs sm:text-sm font-bold transition ${
              state.activeTab === 'dealerFee'
                ? 'bg-amber-400 text-slate-950 shadow'
                : 'text-slate-300 hover:bg-slate-800/70'
            }"
          >
            🎟️ 딜러비 추첨
          </button>
          <button
            type="button"
            data-action="switch-tab"
            data-tab="manjing"
            class="py-2.5 px-2 rounded-xl text-xs sm:text-sm font-bold transition ${
              state.activeTab === 'manjing'
                ? 'bg-emerald-500 text-slate-950 shadow'
                : 'text-slate-300 hover:bg-slate-800/70'
            }"
          >
            💰 맨징
          </button>
        </nav>

        <!-- 탭 1: 자리뽑기 -->
        ${state.activeTab === 'seats' ? `
          <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 space-y-4 shadow-lg">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h2 class="text-base font-extrabold text-white">홀덤 테이블 자리뽑기</h2>
                <p class="text-xs text-slate-400">총 ${attendees.length}석 · 딜러(D) 다음 좌석이 1번으로 배정됩니다</p>
              </div>

              <div class="flex items-center gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
                <button
                  type="button"
                  data-action="dealer-mode"
                  data-mode="random"
                  class="px-2.5 py-1 rounded-lg font-bold ${
                    state.dealerMode === 'random' ? 'bg-amber-400 text-slate-950' : 'text-slate-400'
                  }"
                >
                  딜러 랜덤
                </button>
                <button
                  type="button"
                  data-action="dealer-mode"
                  data-mode="manual"
                  class="px-2.5 py-1 rounded-lg font-bold ${
                    state.dealerMode === 'manual' ? 'bg-amber-400 text-slate-950' : 'text-slate-400'
                  }"
                >
                  딜러 직접지정
                </button>
              </div>
            </div>

            ${state.dealerMode === 'manual' && attendees.length > 0 ? `
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">딜러 선택</label>
                <select
                  id="manualDealerSelect"
                  class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white outline-none"
                >
                  ${attendees.map(name => `
                    <option value="${name}" ${state.manualDealer === name ? 'selected' : ''}>${name} (딜러)</option>
                  `).join('')}
                </select>
              </div>
            ` : ''}

            ${renderPokerTable(state.seatAssignments)}

            <button
              type="button"
              data-action="draw-seats"
              class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-slate-950 font-extrabold text-sm sm:text-base shadow-lg transition"
            >
              🎲 자리뽑기 실행 (${attendees.length}명)
            </button>

            ${state.seatAssignments.length > 0 ? `
              <div class="pt-2 border-t border-slate-800">
                <div class="text-xs font-bold text-slate-400 mb-2">좌석 배정 목록</div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                  ${state.seatAssignments.map(s => `
                    <div class="flex items-center justify-between px-3 py-2 rounded-xl border ${
                      s.isDealer
                        ? 'bg-amber-400/15 border-amber-400/50 text-amber-200'
                        : 'bg-slate-950/80 border-slate-800 text-slate-200'
                    }">
                      <span class="text-xs font-extrabold ${s.isDealer ? 'text-amber-300' : 'text-emerald-400'}">${s.seatLabel}</span>
                      <span class="text-sm font-bold">${s.name}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </section>
        ` : ''}

        <!-- 탭 2: 딜러비 추첨 (회차 기록 없이 단발 추첨 후 종료) -->
        ${state.activeTab === 'dealerFee' ? `
          <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-4 shadow-lg">
            <div>
              <h2 class="text-base font-extrabold text-white">라운드 종료 딜러비 추첨</h2>
              <p class="text-xs text-slate-400 mt-0.5">
                참석 인원 중 딜러(${state.dealerName || '미지정'})를 제외한 나머지 ${nonDealerAttendees.length}명 중 랜덤 2명 당첨
              </p>
            </div>

            <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5 text-xs space-y-1.5">
              <div class="flex items-center justify-between">
                <span class="text-slate-400">현재 딜러 (추첨 제외)</span>
                <span class="font-bold text-amber-300">${state.dealerName ? `${state.dealerName} (D)` : '자리뽑기 전 전체 대상'}</span>
              </div>
              <div class="flex items-center justify-between">
                <span class="text-slate-400">추첨 대상 인원</span>
                <span class="font-bold text-emerald-300">${nonDealerAttendees.length}명</span>
              </div>
            </div>

            ${state.dealerFeeDone ? `
              <div class="bg-gradient-to-br from-amber-400/15 to-emerald-500/10 border border-amber-400/50 rounded-2xl p-5 text-center space-y-3">
                <div class="inline-block px-3 py-1 rounded-full bg-amber-400 text-slate-950 text-xs font-extrabold">
                  추첨 완료 · 종료
                </div>
                <div class="text-sm text-slate-300 font-semibold">이번 라운드 딜러비 당첨자 (2명)</div>
                <div class="flex items-center justify-center gap-3 pt-1">
                  ${state.dealerFeeWinners.map((winner, i) => `
                    <div class="px-5 py-3 rounded-2xl bg-slate-950 border border-amber-300/60 shadow-md">
                      <div class="text-[11px] text-amber-300 font-bold">당첨 ${i + 1}</div>
                      <div class="text-lg font-extrabold text-white mt-0.5">${winner}</div>
                    </div>
                  `).join('')}
                </div>
                <button
                  type="button"
                  data-action="reset-dealer-fee"
                  class="mt-2 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold border border-slate-700"
                >
                  새 라운드 준비하기
                </button>
              </div>
            ` : `
              <button
                type="button"
                data-action="draw-dealer-fee"
                class="w-full py-4 rounded-2xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-sm sm:text-base shadow-lg transition"
              >
                🎟️ 딜러비 2명 추첨하기
              </button>
            `}
          </section>
        ` : ''}

        <!-- 탭 3: 맨징 계산기 -->
        ${state.activeTab === 'manjing' ? `
          <section class="space-y-4">
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-lg space-y-3">
              <div class="flex items-center justify-between">
                <label for="totalPoolInput" class="text-sm font-bold text-amber-300">
                  ● 총 맨징 금액 (배분할 상금)
                </label>
                <button
                  type="button"
                  data-action="toggle-round100"
                  class="px-3 py-1 rounded-full text-xs font-bold border transition ${
                    state.roundTo100
                      ? 'bg-amber-400/20 border-amber-400 text-amber-200'
                      : 'bg-slate-800 border-slate-700 text-slate-300'
                  }"
                >
                  ${state.roundTo100 ? '100원 반올림 ON' : '100원 반올림 OFF'}
                </button>
              </div>

              <div class="relative">
                <input
                  id="totalPoolInput"
                  type="text"
                  inputmode="numeric"
                  value="${formatNumber(pool)}"
                  class="w-full bg-slate-950 border border-slate-700 focus:border-emerald-400 rounded-2xl px-4 py-3.5 pr-12 text-right text-xl font-extrabold text-white outline-none"
                />
                <span class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-bold text-slate-400">원</span>
              </div>

              <div class="grid grid-cols-4 gap-2">
                <button type="button" data-action="add-pool" data-amount="10000" class="py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200">+1만</button>
                <button type="button" data-action="add-pool" data-amount="50000" class="py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200">+5만</button>
                <button type="button" data-action="add-pool" data-amount="100000" class="py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200">+10만</button>
                <button type="button" data-action="reset-pool" class="py-2 rounded-xl bg-rose-950/70 hover:bg-rose-900/70 text-xs font-bold text-rose-300 border border-rose-800/50">초기화</button>
              </div>
            </div>

            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-lg space-y-3">
              <div class="flex items-center justify-between text-xs text-slate-400">
                <span class="font-bold text-slate-200">참여 멤버 마이너스 입력 (${items.length}명)</span>
                <span>총 마이너스: <strong class="text-rose-300">${formatNumber(totalLoss)}원</strong></span>
              </div>

              ${items.length === 0 ? `
                <div class="text-center py-8 text-sm text-slate-400">
                  위에서 오늘 참석 멤버를 체크해 주세요.
                </div>
              ` : `
                <div class="space-y-2.5">
                  ${items.map((item, idx) => `
                    <div class="bg-slate-950/90 border border-slate-800 rounded-2xl p-3 space-y-2">
                      <div class="flex items-center justify-between">
                        <span class="text-sm font-extrabold text-white">${idx + 1}. ${item.name}</span>
                        <span class="text-xs font-semibold text-slate-400">비율 ${(item.ratio * 100).toFixed(1)}%</span>
                      </div>

                      <div class="grid grid-cols-2 gap-2 items-center">
                        <div class="relative">
                          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-bold text-rose-400">-</span>
                          <input
                            type="text"
                            inputmode="numeric"
                            data-player-loss-id="${item.id}"
                            value="${formatNumber(item.loss)}"
                            class="w-full bg-slate-900 border border-slate-800 focus:border-emerald-400 rounded-xl pl-7 pr-7 py-2 text-right text-sm font-bold text-white outline-none"
                          />
                          <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-slate-500">원</span>
                        </div>

                        <div class="bg-emerald-500/10 border border-emerald-500/30 rounded-xl px-3 py-2 text-right">
                          <div class="text-[10px] text-emerald-300/80 font-semibold">맨징 금액</div>
                          <div class="text-sm font-extrabold text-emerald-300">+${formatNumber(item.settledAmount)}원</div>
                        </div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}

              <div class="grid grid-cols-2 gap-2.5 pt-2">
                <button
                  type="button"
                  data-action="copy-kakao"
                  class="py-3 rounded-2xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-xs sm:text-sm transition"
                >
                  ${state.copiedText ? '✓ 카톡 복사 완료' : '💬 카톡 내역 복사'}
                </button>
                <button
                  type="button"
                  data-action="export-png"
                  class="py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs sm:text-sm transition"
                >
                  ${state.exportingImage ? '저장 중...' : '🖼️ 이미지 저장 (PNG)'}
                </button>
              </div>
            </div>
          </section>
        ` : ''}
      `;

      bindEvents();
    }

    function bindEvents() {
      const regInput = document.getElementById('newRegularInput');
      if (regInput) {
        regInput.addEventListener('input', (e) => {
          state.newRegularInput = e.target.value;
        });
        regInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') addRegularMember();
        });
      }

      const guestInput = document.getElementById('newGuestInput');
      if (guestInput) {
        guestInput.addEventListener('input', (e) => {
          state.newGuestInput = e.target.value;
        });
        guestInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') addGuestMember();
        });
      }

      const manualSelect = document.getElementById('manualDealerSelect');
      if (manualSelect) {
        manualSelect.addEventListener('change', (e) => {
          state.manualDealer = e.target.value;
        });
      }

      const poolInput = document.getElementById('totalPoolInput');
      if (poolInput) {
        poolInput.addEventListener('input', (e) => {
          const val = parseDigits(e.target.value);
          state.totalPool = val;
          e.target.value = formatNumber(val);
        });
        poolInput.addEventListener('blur', () => render());
      }

      document.querySelectorAll('[data-player-loss-id]').forEach((input) => {
        input.addEventListener('input', (e) => {
          const id = Number(e.target.getAttribute('data-player-loss-id'));
          const val = parseDigits(e.target.value);
          state.players = state.players.map(p => (p.id === id ? { ...p, loss: val } : p));
          e.target.value = formatNumber(val);
        });
        input.addEventListener('blur', () => render());
      });

      document.querySelectorAll('[data-action]').forEach((el) => {
        el.addEventListener('click', () => {
          const action = el.getAttribute('data-action');
          if (action === 'toggle-member') {
            toggleAttendee(el.getAttribute('data-name'));
          } else if (action === 'select-all-regulars') {
            state.selectedMembers = [...state.regularMembers];
            persistMemberState();
            render();
          } else if (action === 'clear-selection') {
            state.selectedMembers = [];
            state.guestMembers = [];
            persistMemberState();
            render();
          } else if (action === 'add-regular') {
            addRegularMember();
          } else if (action === 'add-guest') {
            addGuestMember();
          } else if (action === 'switch-tab') {
            state.activeTab = el.getAttribute('data-tab');
            render();
          } else if (action === 'dealer-mode') {
            state.dealerMode = el.getAttribute('data-mode');
            if (state.dealerMode === 'manual' && !state.manualDealer) {
              state.manualDealer = getAllAttendees()[0] || '';
            }
            render();
          } else if (action === 'draw-seats') {
            drawSeats();
          } else if (action === 'draw-dealer-fee') {
            drawDealerFeeWinners();
          } else if (action === 'reset-dealer-fee') {
            resetDealerFeeRound();
          } else if (action === 'toggle-round100') {
            state.roundTo100 = !state.roundTo100;
            render();
          } else if (action === 'add-pool') {
            const amount = Number(el.getAttribute('data-amount')) || 0;
            state.totalPool = (Number(state.totalPool) || 0) + amount;
            render();
          } else if (action === 'reset-pool') {
            state.totalPool = 0;
            state.players = state.players.map(p => ({ ...p, loss: 0 }));
            render();
          } else if (action === 'copy-kakao') {
            copySettlementText();
          } else if (action === 'export-png') {
            exportSettlementPng();
          }
        });
      });
    }

    render();
  </script>
</body>
</html>
