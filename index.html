<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Holic 홀덤 매니저</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #090d16;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
    .felt-surface {
      background: radial-gradient(ellipse at center, #155e47 0%, #0d3b2c 68%, #072219 100%);
      box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.7);
    }
    .table-rail {
      background: linear-gradient(145deg, #2d2419 0%, #17130f 55%, #261e15 100%);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(251, 191, 36, 0.3);
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
  <div id="app" class="w-full max-w-md mx-auto px-3.5 py-4 pb-24"></div>

  <script>
    const DEFAULT_REGULAR_MEMBERS = [
      '민석', '민겸', '서이', '진겸', '윤범', '민중', '주광', '동준', '미림',
      '중훈', '나윤', '재호', '한빈', '선수', '태현', '윤아', '영모'
    ];

    // 관리자 해지(삭제) 전용 PIN (원하는 숫자로 변경 가능)
    const ADMIN_PIN = '1234';

    const STORAGE_KEYS = {
      regulars: 'holic_regular_members_v2',
      selected: 'holic_selected_members_v2',
      guests: 'holic_guest_members_v2'
    };

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function saveJSON(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {}
    }

    const state = {
      activeTab: 'seats', // 'seats' | 'dealerFee' | 'manjing'
      regularMembers: loadJSON(STORAGE_KEYS.regulars, DEFAULT_REGULAR_MEMBERS),
      guestMembers: loadJSON(STORAGE_KEYS.guests, []),
      selectedMembers: loadJSON(STORAGE_KEYS.selected, ['민석', '민겸', '서이', '진겸', '중훈', '나윤']),
      newRegularInput: '',
      newGuestInput: '',

      // 관리자 단골 해지 모드 상태
      isAdminUnlocked: false,
      showAdminPinPrompt: false,
      adminPinInput: '',

      // 자리뽑기 상태 ('__RANDOM__'이면 랜덤 딜러, 그 외는 수동 지정 딜러)
      selectedDealer: '__RANDOM__',
      dealerName: '',
      seatAssignments: [],

      dealerFeeWinners: [],
      dealerFeeDone: false,

      totalPool: 0,
      roundTo100: true,
      players: [],
      lastSyncedSignature: '',
      copiedText: false,
      exportingImage: false,
      statusMessage: ''
    };

    function getAllAttendees() {
      const combined = [...state.selectedMembers, ...state.guestMembers];
      return [...new Set(combined)].filter(name => name && name.trim());
    }

    function syncManjingPlayers(force = false) {
      const attendees = getAllAttendees();
      const signature = attendees.join('|');
      if (!force && signature === state.lastSyncedSignature && state.players.length === attendees.length) {
        return;
      }
      const existingMap = new Map(state.players.map(p => [p.name, p]));
      state.players = attendees.map((name, idx) => {
        const prev = existingMap.get(name);
        return {
          id: prev ? prev.id : idx + 1,
          name,
          loss: prev ? prev.loss : 0
        };
      });
      state.lastSyncedSignature = signature;
    }

    function formatNumber(num) {
      const n = Number(num) || 0;
      return n.toLocaleString('ko-KR');
    }

    function parseDigits(val) {
      const cleaned = String(val || '').replace(/[^0-9]/g, '');
      return cleaned ? parseInt(cleaned, 10) : 0;
    }

    function roundSettlement(amount, roundTo100) {
      if (!roundTo100) return Math.round(amount);
      return Math.round(amount / 100) * 100;
    }

    function showToast(msg) {
      state.statusMessage = msg;
      render();
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        state.statusMessage = '';
        render();
      }, 2100);
    }

    function persistMemberState() {
      saveJSON(STORAGE_KEYS.regulars, state.regularMembers);
      saveJSON(STORAGE_KEYS.guests, state.guestMembers);
      saveJSON(STORAGE_KEYS.selected, state.selectedMembers);
      syncManjingPlayers(true);

      const attendees = getAllAttendees();
      if (state.selectedDealer !== '__RANDOM__' && !attendees.includes(state.selectedDealer)) {
        state.selectedDealer = '__RANDOM__';
      }
      if (state.seatAssignments.length > 0) {
        const currentSeatNames = state.seatAssignments.map(s => s.name);
        const sameSet =
          currentSeatNames.length === attendees.length &&
          attendees.every(a => currentSeatNames.includes(a));
        if (!sameSet) {
          state.seatAssignments = [];
          state.dealerName = '';
        }
      }
      if (state.dealerFeeWinners.length > 0) {
        const invalidWinner = state.dealerFeeWinners.some(w => !attendees.includes(w) || w === state.dealerName);
        if (invalidWinner) {
          state.dealerFeeWinners = [];
          state.dealerFeeDone = false;
        }
      }
    }

    function toggleAttendee(name) {
      if (state.guestMembers.includes(name)) {
        state.guestMembers = state.guestMembers.filter(g => g !== name);
      } else if (state.selectedMembers.includes(name)) {
        state.selectedMembers = state.selectedMembers.filter(m => m !== name);
      } else {
        state.selectedMembers = [...state.selectedMembers, name];
      }
      persistMemberState();
      render();
    }

    function addRegularMember() {
      const trimmed = state.newRegularInput.trim();
      if (!trimmed) return;
      if (state.regularMembers.includes(trimmed)) {
        showToast('이미 단골 멤버에 있는 이름입니다.');
        return;
      }
      state.regularMembers = [...state.regularMembers, trimmed];
      state.selectedMembers = [...new Set([...state.selectedMembers, trimmed])];
      state.newRegularInput = '';
      persistMemberState();
      showToast(`'${trimmed}' 단골 추가 완료`);
    }

    // 관리자 전용 단골 해지(삭제)
    function revokeRegularMember(name) {
      if (!state.isAdminUnlocked) {
        state.showAdminPinPrompt = true;
        showToast('관리자 인증 후 해지할 수 있습니다.');
        return;
      }
      state.regularMembers = state.regularMembers.filter(m => m !== name);
      state.selectedMembers = state.selectedMembers.filter(m => m !== name);
      persistMemberState();
      showToast(`단골 '${name}' 해지 완료`);
    }

    function verifyAdminPin() {
      if (state.adminPinInput.trim() === ADMIN_PIN) {
        state.isAdminUnlocked = true;
        state.showAdminPinPrompt = false;
        state.adminPinInput = '';
        showToast('관리자 모드 활성화 (단골 해지 가능)');
      } else {
        state.adminPinInput = '';
        showToast('관리자 PIN이 일치하지 않습니다.');
      }
    }

    function addGuestMember() {
      const trimmed = state.newGuestInput.trim();
      if (!trimmed) return;
      const allKnown = [...state.regularMembers, ...state.guestMembers];
      if (allKnown.includes(trimmed)) {
        if (!state.selectedMembers.includes(trimmed) && state.regularMembers.includes(trimmed)) {
          state.selectedMembers = [...state.selectedMembers, trimmed];
          persistMemberState();
          showToast(`'${trimmed}' 참석 체크 완료`);
          return;
        }
        showToast('이미 참가자 목록에 있습니다.');
        return;
      }
      state.guestMembers = [...state.guestMembers, trimmed];
      state.newGuestInput = '';
      persistMemberState();
      showToast(`추가 참가자 '${trimmed}' 등록 완료`);
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // 수동 딜러가 선택되면 딜러를 고정하고 나머지 인원으로만 자리뽑기 진행
    function drawSeats() {
      const attendees = getAllAttendees();
      if (attendees.length < 2) {
        showToast('최소 2명 이상 체크해 주세요.');
        return;
      }

      const chosenDealer =
        state.selectedDealer !== '__RANDOM__' && attendees.includes(state.selectedDealer)
          ? state.selectedDealer
          : attendees[Math.floor(Math.random() * attendees.length)];

      const remainingPlayers = shuffleArray(attendees.filter(name => name !== chosenDealer));
      state.dealerName = chosenDealer;
      state.seatAssignments = [
        {
          seatNumber: 0,
          seatLabel: 'D (딜러)',
          name: chosenDealer,
          isDealer: true
        },
        ...remainingPlayers.map((name, idx) => ({
          seatNumber: idx + 1,
          seatLabel: `${idx + 1}번`,
          name,
          isDealer: false
        }))
      ];
      state.dealerFeeWinners = [];
      state.dealerFeeDone = false;
      render();
    }

    function drawDealerFeeWinners() {
      const attendees = getAllAttendees();
      const eligible = attendees.filter(name => name !== state.dealerName);
      if (eligible.length < 2) {
        showToast('딜러 제외 2명 이상 필요합니다.');
        return;
      }
      state.dealerFeeWinners = shuffleArray(eligible).slice(0, 2);
      state.dealerFeeDone = true;
      render();
    }

    function resetDealerFeeRound() {
      state.dealerFeeWinners = [];
      state.dealerFeeDone = false;
      render();
    }

    function calculateManjing() {
      const pool = Math.max(0, Number(state.totalPool) || 0);
      const validPlayers = state.players.map(p => ({
        ...p,
        loss: Math.max(0, Number(p.loss) || 0)
      }));
      const totalLoss = validPlayers.reduce((sum, p) => sum + p.loss, 0);

      if (totalLoss <= 0) {
        return {
          pool,
          totalLoss: 0,
          items: validPlayers.map(p => ({
            ...p,
            ratio: 0,
            exactAmount: 0,
            settledAmount: 0
          }))
        };
      }

      const items = validPlayers.map(p => {
        const ratio = p.loss / totalLoss;
        const exactAmount = pool * ratio;
        const settledAmount = roundSettlement(exactAmount, state.roundTo100);
        return {
          ...p,
          ratio,
          exactAmount,
          settledAmount
        };
      });

      return { pool, totalLoss, items };
    }

    function buildKakaoText() {
      const { pool, totalLoss, items } = calculateManjing();
      const lines = [
        `🃏 [Holic] 홀덤 맨징 정산`,
        `• 총 맨징 금액: ${formatNumber(pool)}원`,
        `• 총 마이너스 합계: ${formatNumber(totalLoss)}원`,
        `• 반올림 기준: ${state.roundTo100 ? '100원 단위' : '원 단위'}`,
        ``
      ];
      items.forEach((item, index) => {
        const pct = (item.ratio * 100).toFixed(1);
        lines.push(
          `${index + 1}. ${item.name} — 마이너스 ${formatNumber(item.loss)}원 (${pct}%) → 맨징 ${formatNumber(item.settledAmount)}원`
        );
      });
      return lines.join('\n');
    }

    async function copySettlementText() {
      const text = buildKakaoText();
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        state.copiedText = true;
        render();
        showToast('카톡 정산 내역 복사 완료');
        setTimeout(() => {
          state.copiedText = false;
          render();
        }, 1800);
      } catch {
        showToast('복사에 실패했습니다.');
      }
    }

    function exportSettlementPng() {
      state.exportingImage = true;
      render();

      const { pool, totalLoss, items } = calculateManjing();
      const width = 900;
      const rowHeight = 76;
      const height = 260 + Math.max(items.length, 1) * rowHeight;

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, width, height);
      bgGrad.addColorStop(0, '#090d16');
      bgGrad.addColorStop(1, '#111827');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = 'rgba(245, 158, 11, 0.35)';
      ctx.lineWidth = 3;
      ctx.strokeRect(24, 24, width - 48, height - 48);

      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 34px Pretendard, sans-serif';
      ctx.fillText('Holic 홀덤 맨징 정산표', 56, 86);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '22px Pretendard, sans-serif';
      ctx.fillText(
        `총 맨징: ${formatNumber(pool)}원   |   총 마이너스: ${formatNumber(totalLoss)}원   |   ${state.roundTo100 ? '100원 반올림' : '원 단위'}`,
        56,
        132
      );

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(56, 162);
      ctx.lineTo(width - 56, 162);
      ctx.stroke();

      items.forEach((item, idx) => {
        const y = 212 + idx * rowHeight;
        ctx.fillStyle = 'rgba(30, 41, 59, 0.72)';
        ctx.fillRect(56, y - 34, width - 112, 58);

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 24px Pretendard, sans-serif';
        ctx.fillText(`${idx + 1}. ${item.name}`, 76, y + 3);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '20px Pretendard, sans-serif';
        ctx.fillText(`-${formatNumber(item.loss)}원 (${(item.ratio * 100).toFixed(1)}%)`, 280, y + 3);

        ctx.fillStyle = '#34d399';
        ctx.font = 'bold 25px Pretendard, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`+${formatNumber(item.settledAmount)}원`, width - 76, y + 3);
        ctx.textAlign = 'left';
      });

      const link = document.createElement('a');
      link.download = `holic-manjing-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();

      state.exportingImage = false;
      render();
      showToast('PNG 이미지 저장 완료');
    }

    function renderPokerTable(assignments) {
      const count = assignments.length;
      if (count === 0) {
        return `
          <div class="table-rail rounded-[36px] p-2.5 my-2">
            <div class="felt-surface rounded-[28px] py-10 px-4 text-center border border-emerald-400/20">
              <div class="text-xs font-extrabold tracking-wider text-amber-300">HOLDEM TABLE</div>
              <div class="text-sm font-bold text-white mt-1">딜러를 정한 뒤 자리뽑기 실행을 눌러주세요</div>
              <div class="text-xs text-emerald-200/75 mt-1">선택된 딜러 제외 인원이 1번부터 시계방향 배정됩니다</div>
            </div>
          </div>
        `;
      }

      const seatCoords = assignments.map((seat, idx) => {
        const angle = -Math.PI / 2 + (2 * Math.PI * idx) / count;
        const rx = 36;
        const ry = 35;
        const left = 50 + rx * Math.cos(angle);
        const top = 50 + ry * Math.sin(angle);
        return { ...seat, left, top };
      });

      return `
        <div class="my-2 px-1">
          <div class="table-rail rounded-[42px] p-2.5">
            <div class="felt-surface relative w-full h-[330px] rounded-[34px] border border-emerald-400/25">
              <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none select-none text-center px-3">
                <span class="text-[10px] font-bold tracking-[0.2em] text-amber-300/85">HOLIC HOLDEM</span>
                <span class="text-sm font-extrabold text-white mt-0.5">딜러: ${state.dealerName}</span>
                <span class="text-[11px] text-emerald-200/75 mt-0.5">딜러 다음 → 1번 시계방향</span>
              </div>

              ${seatCoords.map(seat => `
                <div
                  style="left: ${seat.left.toFixed(1)}%; top: ${seat.top.toFixed(1)}%; transform: translate(-50%, -50%);"
                  class="absolute z-10 min-w-[66px] max-w-[84px] rounded-xl px-2 py-1.5 text-center shadow-lg border ${
                    seat.isDealer
                      ? 'bg-amber-400 text-slate-950 border-amber-200 ring-2 ring-amber-300/60'
                      : 'bg-slate-900/95 text-white border-slate-700'
                  }"
                >
                  <div class="text-[10px] font-extrabold leading-tight ${
                    seat.isDealer ? 'text-slate-900' : 'text-emerald-400'
                  }">
                    ${seat.seatLabel}
                  </div>
                  <div class="text-xs font-extrabold truncate leading-tight mt-0.5">${seat.name}</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      syncManjingPlayers();
      const attendees = getAllAttendees();
      const nonDealerAttendees = attendees.filter(name => name !== state.dealerName);
      const { pool, totalLoss, items } = calculateManjing();

      const appEl = document.getElementById('app');
      appEl.innerHTML = `
        ${state.statusMessage ? `
          <div class="fixed top-3 left-1/2 -translate-x-1/2 z-50 bg-slate-800 text-amber-300 border border-amber-400/50 px-4 py-2 rounded-full text-xs font-bold shadow-xl">
            ${state.statusMessage}
          </div>
        ` : ''}

        <!-- 컴팩트 앱 헤더 -->
        <header class="flex items-center justify-between bg-slate-900/95 border border-slate-800 rounded-2xl px-3.5 py-2.5 mb-3 shadow">
          <div class="flex items-center gap-2.5 min-w-0">
            <img
              src="icon.png"
              alt="Holic"
              onerror="this.style.display='none'"
              class="w-11 h-11 rounded-xl object-cover shrink-0 border border-amber-400/40"
            />
            <div class="min-w-0">
              <h1 class="text-base font-extrabold text-white truncate">Holic 홀덤 매니저</h1>
              <p class="text-[11px] text-slate-400 truncate">멤버 체크 후 탭으로 바로 진행</p>
            </div>
          </div>
          <span class="shrink-0 px-2.5 py-1 rounded-full text-xs font-extrabold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
            ${attendees.length}명 참석
          </span>
        </header>

        <!-- 멤버 설정 카드 -->
        <section class="bg-slate-900/95 border border-slate-800 rounded-2xl p-3.5 mb-3 shadow">
          <div class="flex items-center justify-between gap-2 mb-2.5">
            <h2 class="text-sm font-extrabold text-white">오늘 참석 멤버</h2>
            <div class="flex items-center gap-1.5 text-xs font-bold">
              <button type="button" data-action="select-all-regulars" class="px-2 py-1 rounded-lg bg-slate-800 text-emerald-300 active:scale-95">
                전체선택
              </button>
              <button type="button" data-action="clear-selection" class="px-2 py-1 rounded-lg bg-slate-800 text-slate-300 active:scale-95">
                해제
              </button>
              <button
                type="button"
                data-action="toggle-admin-lock"
                class="px-2 py-1 rounded-lg border active:scale-95 ${
                  state.isAdminUnlocked
                    ? 'bg-rose-500/20 border-rose-400/50 text-rose-200'
                    : 'bg-slate-950 border-slate-700 text-amber-300'
                }"
              >
                ${state.isAdminUnlocked ? '관리자 ON' : '🔒 관리자'}
              </button>
            </div>
          </div>

          <!-- 관리자 PIN 인증창 -->
          ${state.showAdminPinPrompt && !state.isAdminUnlocked ? `
            <div class="mb-2.5 p-2.5 rounded-xl bg-slate-950 border border-amber-400/40 flex items-center gap-2">
              <input
                type="password"
                id="adminPinInput"
                inputmode="numeric"
                value="${state.adminPinInput}"
                placeholder="관리자 PIN 입력"
                class="flex-1 min-w-0 h-9 bg-slate-900 border border-slate-700 rounded-lg px-2.5 text-xs text-white outline-none"
              />
              <button
                type="button"
                data-action="verify-admin-pin"
                class="h-9 px-3 rounded-lg bg-amber-400 text-slate-950 text-xs font-black"
              >
                확인
              </button>
            </div>
          ` : ''}

          <!-- 선택된 참석자 요약 칩 -->
          <div class="flex flex-wrap gap-1.5 mb-2.5 min-h-[28px]">
            ${attendees.length > 0 ? attendees.map(name => `
              <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-500/15 text-emerald-200 border border-emerald-500/30">
                ${name}
              </span>
            `).join('') : `<span class="text-xs text-slate-500 py-1">참석 멤버를 터치해 선택하세요.</span>`}
          </div>

          <!-- 단골 멤버 3열 버튼 그리드 (관리자 ON일 때 해지 × 버튼 표시) -->
          <div class="grid grid-cols-3 gap-2 mb-3">
            ${state.regularMembers.map(member => {
              const checked = state.selectedMembers.includes(member);
              return `
                <div class="relative flex items-center">
                  <button
                    type="button"
                    data-action="toggle-member"
                    data-name="${member}"
                    class="w-full min-h-[42px] ${state.isAdminUnlocked ? 'pr-7 pl-2.5' : 'px-2.5'} py-2 rounded-xl text-sm font-extrabold border flex items-center justify-between active:scale-95 transition ${
                      checked
                        ? 'bg-emerald-500/20 border-emerald-400 text-emerald-200'
                        : 'bg-slate-950 border-slate-800 text-slate-400'
                    }"
                  >
                    <span class="truncate">${member}</span>
                    <span class="text-xs font-black ml-1 ${checked ? 'text-emerald-300' : 'text-slate-600'}">
                      ${checked ? '✓' : '+'}
                    </span>
                  </button>
                  ${state.isAdminUnlocked ? `
                    <button
                      type="button"
                      data-action="revoke-regular"
                      data-name="${member}"
                      title="${member} 단골 해지"
                      class="absolute right-1.5 w-5 h-5 rounded-full bg-rose-500/25 hover:bg-rose-500/40 text-rose-300 text-xs font-black flex items-center justify-center border border-rose-400/40"
                    >
                      ×
                    </button>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>

          <!-- 추가 참가자 칩 -->
          ${state.guestMembers.length > 0 ? `
            <div class="mb-3">
              <div class="text-[11px] font-bold text-amber-300 mb-1.5">오늘 추가 참가자</div>
              <div class="flex flex-wrap gap-1.5">
                ${state.guestMembers.map(guest => `
                  <button
                    type="button"
                    data-action="toggle-member"
                    data-name="${guest}"
                    class="px-3 py-1.5 rounded-full text-xs font-extrabold bg-amber-400/20 text-amber-200 border border-amber-400/50"
                  >
                    ${guest} ×
                  </button>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- 단골 멤버 추가 & 추가 참가자 입력 -->
          <div class="space-y-2 pt-2.5 border-t border-slate-800">
            <div class="flex gap-2">
              <input
                type="text"
                id="newRegularInput"
                value="${state.newRegularInput}"
                placeholder="단골 멤버 이름 추가"
                class="flex-1 min-w-0 h-11 bg-slate-950 border border-slate-800 focus:border-emerald-400 rounded-xl px-3 text-sm text-white placeholder-slate-500 outline-none"
              />
              <button
                type="button"
                data-action="add-regular"
                class="shrink-0 h-11 px-4 rounded-xl bg-slate-800 text-emerald-300 text-xs font-extrabold border border-slate-700 active:scale-95"
              >
                단골등록
              </button>
            </div>
            <div class="flex gap-2">
              <input
                type="text"
                id="newGuestInput"
                value="${state.newGuestInput}"
                placeholder="처음 온 추가 참가자 입력"
                class="flex-1 min-w-0 h-11 bg-slate-950 border border-slate-800 focus:border-amber-400 rounded-xl px-3 text-sm text-white placeholder-slate-500 outline-none"
              />
              <button
                type="button"
                data-action="add-guest"
                class="shrink-0 h-11 px-4 rounded-xl bg-amber-400 text-slate-950 text-xs font-black active:scale-95"
              >
                참가추가
              </button>
            </div>
          </div>
        </section>

        <!-- 3개 기능 탭 -->
        <nav class="grid grid-cols-3 gap-2 bg-slate-900 border border-slate-800 p-1.5 rounded-2xl mb-3 sticky top-2 z-30 shadow-lg">
          <button
            type="button"
            data-action="switch-tab"
            data-tab="seats"
            class="h-11 rounded-xl text-xs font-extrabold transition ${
              state.activeTab === 'seats'
                ? 'bg-emerald-500 text-slate-950'
                : 'text-slate-300'
            }"
          >
            🪑 자리뽑기
          </button>
          <button
            type="button"
            data-action="switch-tab"
            data-tab="dealerFee"
            class="h-11 rounded-xl text-xs font-extrabold transition ${
              state.activeTab === 'dealerFee'
                ? 'bg-amber-400 text-slate-950'
                : 'text-slate-300'
            }"
          >
            🎟️ 딜러비
          </button>
          <button
            type="button"
            data-action="switch-tab"
            data-tab="manjing"
            class="h-11 rounded-xl text-xs font-extrabold transition ${
              state.activeTab === 'manjing'
                ? 'bg-emerald-500 text-slate-950'
                : 'text-slate-300'
            }"
          >
            💰 맨징
          </button>
        </nav>

        <!-- 탭 1: 자리뽑기 -->
        ${state.activeTab === 'seats' ? `
          <section class="bg-slate-900/95 border border-slate-800 rounded-2xl p-3.5 space-y-3 shadow">
            <div>
              <h2 class="text-sm font-extrabold text-white">홀덤 테이블 자리뽑기</h2>
              <p class="text-[11px] text-slate-400">
                총 ${attendees.length}석 · 딜러 지정 시 딜러 제외 ${Math.max(0, attendees.length - 1)}명이 1번부터 배정됩니다
              </p>
            </div>

            ${renderPokerTable(state.seatAssignments)}

            <!-- 딜러 수동 선택 드롭다운 + 자리뽑기 실행 버튼 나란히 배치 -->
            <div class="flex items-stretch gap-2">
              <select
                id="dealerSelectInline"
                aria-label="딜러 선택"
                class="w-36 shrink-0 h-12 bg-slate-950 border border-amber-400/50 focus:border-amber-400 rounded-2xl px-3 text-xs font-extrabold text-amber-200 outline-none"
              >
                <option value="__RANDOM__" ${state.selectedDealer === '__RANDOM__' ? 'selected' : ''}>딜러: 랜덤</option>
                ${attendees.map(name => `
                  <option value="${name}" ${state.selectedDealer === name ? 'selected' : ''}>딜러: ${name}</option>
                `).join('')}
              </select>

              <button
                type="button"
                data-action="draw-seats"
                class="flex-1 min-w-0 h-12 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-black text-sm shadow active:scale-[0.99]"
              >
                🎲 자리뽑기 실행 (${attendees.length}명)
              </button>
            </div>

            ${state.seatAssignments.length > 0 ? `
              <div class="grid grid-cols-2 gap-2 pt-1">
                ${state.seatAssignments.map(s => `
                  <div class="flex items-center justify-between px-3 py-2.5 rounded-xl border ${
                    s.isDealer
                      ? 'bg-amber-400/15 border-amber-400/50 text-amber-200'
                      : 'bg-slate-950 border-slate-800 text-slate-200'
                  }">
                    <span class="text-xs font-black ${s.isDealer ? 'text-amber-300' : 'text-emerald-400'}">${s.seatLabel}</span>
                    <span class="text-sm font-extrabold">${s.name}</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </section>
        ` : ''}

        <!-- 탭 2: 딜러비 추첨 -->
        ${state.activeTab === 'dealerFee' ? `
          <section class="bg-slate-900/95 border border-slate-800 rounded-2xl p-4 space-y-3.5 shadow">
            <div>
              <h2 class="text-sm font-extrabold text-white">라운드 종료 딜러비 추첨</h2>
              <p class="text-xs text-slate-400 mt-0.5">
                딜러(${state.dealerName || '미지정'}) 제외 ${nonDealerAttendees.length}명 중 랜덤 2명 당첨
              </p>
            </div>

            <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs space-y-1.5">
              <div class="flex justify-between">
                <span class="text-slate-400">제외 딜러</span>
                <span class="font-extrabold text-amber-300">${state.dealerName || '없음'}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-400">추첨 대상</span>
                <span class="font-extrabold text-emerald-300">${nonDealerAttendees.length}명</span>
              </div>
            </div>

            ${state.dealerFeeDone ? `
              <div class="bg-amber-400/10 border border-amber-400/40 rounded-2xl p-4 text-center space-y-3">
                <span class="inline-block px-3 py-1 rounded-full bg-amber-400 text-slate-950 text-xs font-black">
                  추첨 완료 · 종료
                </span>
                <div class="grid grid-cols-2 gap-2.5">
                  ${state.dealerFeeWinners.map((winner, i) => `
                    <div class="py-3 px-2 rounded-xl bg-slate-950 border border-amber-300/50">
                      <div class="text-[11px] font-bold text-amber-300">당첨 ${i + 1}</div>
                      <div class="text-base font-black text-white mt-0.5">${winner}</div>
                    </div>
                  `).join('')}
                </div>
                <button
                  type="button"
                  data-action="reset-dealer-fee"
                  class="w-full h-11 rounded-xl bg-slate-800 text-white text-xs font-extrabold border border-slate-700"
                >
                  초기화
                </button>
              </div>
            ` : `
              <button
                type="button"
                data-action="draw-dealer-fee"
                class="w-full h-12 rounded-2xl bg-amber-400 text-slate-950 font-black text-sm shadow active:scale-[0.99]"
              >
                🎟️ 딜러비 2명 추첨하기
              </button>
            `}
          </section>
        ` : ''}

        <!-- 탭 3: 맨징 계산기 -->
        ${state.activeTab === 'manjing' ? `
          <section class="space-y-3">
            <div class="bg-slate-900/95 border border-slate-800 rounded-2xl p-3.5 shadow space-y-3">
              <div class="flex items-center justify-between">
                <label for="totalPoolInput" class="text-sm font-extrabold text-amber-300">총 맨징 금액</label>
                <button
                  type="button"
                  data-action="toggle-round100"
                  class="px-3 py-1.5 rounded-full text-xs font-extrabold border ${
                    state.roundTo100
                      ? 'bg-amber-400/20 border-amber-400 text-amber-200'
                      : 'bg-slate-800 border-slate-700 text-slate-300'
                  }"
                >
                  ${state.roundTo100 ? '100원 반올림 ON' : '100원 반올림 OFF'}
                </button>
              </div>

              <div class="relative">
                <input
                  id="totalPoolInput"
                  type="text"
                  inputmode="numeric"
                  value="${formatNumber(pool)}"
                  class="w-full h-12 bg-slate-950 border border-slate-700 focus:border-emerald-400 rounded-xl px-3.5 pr-9 text-right text-lg font-black text-white outline-none"
                />
                <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">원</span>
              </div>

              <div class="grid grid-cols-4 gap-1.5">
                <button type="button" data-action="add-pool" data-amount="10000" class="h-10 rounded-xl bg-slate-800 text-xs font-extrabold text-slate-200">+1만</button>
                <button type="button" data-action="add-pool" data-amount="50000" class="h-10 rounded-xl bg-slate-800 text-xs font-extrabold text-slate-200">+5만</button>
                <button type="button" data-action="add-pool" data-amount="100000" class="h-10 rounded-xl bg-slate-800 text-xs font-extrabold text-slate-200">+10만</button>
                <button type="button" data-action="reset-pool" class="h-10 rounded-xl bg-rose-950/80 text-xs font-extrabold text-rose-300 border border-rose-800/50">초기화</button>
              </div>
            </div>

            <div class="bg-slate-900/95 border border-slate-800 rounded-2xl p-3.5 shadow space-y-2.5">
              <div class="flex items-center justify-between text-xs">
                <span class="font-extrabold text-white">참여 멤버 (${items.length}명)</span>
                <span class="text-slate-400">총 마이너스 <strong class="text-rose-300">${formatNumber(totalLoss)}원</strong></span>
              </div>

              ${items.length === 0 ? `
                <div class="text-center py-6 text-xs text-slate-400">위에서 참석 멤버를 선택해 주세요.</div>
              ` : items.map((item, idx) => `
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2">
                  <div class="flex items-center justify-between">
                    <span class="text-sm font-extrabold text-white">${idx + 1}. ${item.name}</span>
                    <span class="text-xs font-bold text-slate-400">${(item.ratio * 100).toFixed(1)}%</span>
                  </div>
                  <div class="grid grid-cols-2 gap-2 items-center">
                    <div class="relative">
                      <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs font-black text-rose-400">-</span>
                      <input
                        type="text"
                        inputmode="numeric"
                        data-player-loss-id="${item.id}"
                        value="${formatNumber(item.loss)}"
                        class="w-full h-11 bg-slate-900 border border-slate-800 focus:border-emerald-400 rounded-xl pl-6 pr-6 text-right text-sm font-extrabold text-white outline-none"
                      />
                      <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-slate-500">원</span>
                    </div>
                    <div class="h-11 bg-emerald-500/10 border border-emerald-500/30 rounded-xl px-3 flex flex-col justify-center text-right">
                      <span class="text-[10px] text-emerald-300/80 font-bold leading-none">맨징 금액</span>
                      <span class="text-sm font-black text-emerald-300 leading-tight mt-0.5">+${formatNumber(item.settledAmount)}원</span>
                    </div>
                  </div>
                </div>
              `).join('')}

              <div class="grid grid-cols-2 gap-2 pt-1">
                <button
                  type="button"
                  data-action="copy-kakao"
                  class="h-12 rounded-xl bg-amber-400 text-slate-950 font-black text-xs"
                >
                  ${state.copiedText ? '✓ 복사 완료' : '💬 카톡 내역 복사'}
                </button>
                <button
                  type="button"
                  data-action="export-png"
                  class="h-12 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs"
                >
                  ${state.exportingImage ? '저장 중...' : '🖼️ 이미지 저장'}
                </button>
              </div>
            </div>
          </section>
        ` : ''}
      `;

      bindEvents();
    }

    function bindEvents() {
      const regInput = document.getElementById('newRegularInput');
      if (regInput) {
        regInput.addEventListener('input', (e) => {
          state.newRegularInput = e.target.value;
        });
        regInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') addRegularMember();
        });
      }

      const guestInput = document.getElementById('newGuestInput');
      if (guestInput) {
        guestInput.addEventListener('input', (e) => {
          state.newGuestInput = e.target.value;
        });
        guestInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') addGuestMember();
        });
      }

      const pinInput = document.getElementById('adminPinInput');
      if (pinInput) {
        pinInput.addEventListener('input', (e) => {
          state.adminPinInput = e.target.value;
        });
        pinInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') verifyAdminPin();
        });
      }

      const dealerSelect = document.getElementById('dealerSelectInline');
      if (dealerSelect) {
        dealerSelect.addEventListener('change', (e) => {
          state.selectedDealer = e.target.value;
        });
      }

      const poolInput = document.getElementById('totalPoolInput');
      if (poolInput) {
        poolInput.addEventListener('input', (e) => {
          const val = parseDigits(e.target.value);
          state.totalPool = val;
          e.target.value = formatNumber(val);
        });
        poolInput.addEventListener('blur', () => render());
      }

      document.querySelectorAll('[data-player-loss-id]').forEach((input) => {
        input.addEventListener('input', (e) => {
          const id = Number(e.target.getAttribute('data-player-loss-id'));
          const val = parseDigits(e.target.value);
          state.players = state.players.map(p => (p.id === id ? { ...p, loss: val } : p));
          e.target.value = formatNumber(val);
        });
        input.addEventListener('blur', () => render());
      });

      document.querySelectorAll('[data-action]').forEach((el) => {
        el.addEventListener('click', () => {
          const action = el.getAttribute('data-action');
          if (action === 'toggle-member') {
            toggleAttendee(el.getAttribute('data-name'));
          } else if (action === 'select-all-regulars') {
            state.selectedMembers = [...state.regularMembers];
            persistMemberState();
            render();
          } else if (action === 'clear-selection') {
            state.selectedMembers = [];
            state.guestMembers = [];
            persistMemberState();
            render();
          } else if (action === 'toggle-admin-lock') {
            if (state.isAdminUnlocked) {
              state.isAdminUnlocked = false;
              state.showAdminPinPrompt = false;
              showToast('관리자 모드 종료');
            } else {
              state.showAdminPinPrompt = !state.showAdminPinPrompt;
              render();
            }
          } else if (action === 'verify-admin-pin') {
            verifyAdminPin();
          } else if (action === 'revoke-regular') {
            revokeRegularMember(el.getAttribute('data-name'));
          } else if (action === 'add-regular') {
            addRegularMember();
          } else if (action === 'add-guest') {
            addGuestMember();
          } else if (action === 'switch-tab') {
            state.activeTab = el.getAttribute('data-tab');
            render();
          } else if (action === 'draw-seats') {
            drawSeats();
          } else if (action === 'draw-dealer-fee') {
            drawDealerFeeWinners();
          } else if (action === 'reset-dealer-fee') {
            resetDealerFeeRound();
          } else if (action === 'toggle-round100') {
            state.roundTo100 = !state.roundTo100;
            render();
          } else if (action === 'add-pool') {
            const amount = Number(el.getAttribute('data-amount')) || 0;
            state.totalPool = (Number(state.totalPool) || 0) + amount;
            render();
          } else if (action === 'reset-pool') {
            state.totalPool = 0;
            state.players = state.players.map(p => ({ ...p, loss: 0 }));
            render();
          } else if (action === 'copy-kakao') {
            copySettlementText();
          } else if (action === 'export-png') {
            exportSettlementPng();
          }
        });
      });
    }

    render();
  </script>
</body>
</html>
