<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Holic 홀덤 매니저</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      overflow-x: hidden;
    }
    * { box-sizing: border-box; }
  </style>
</head>
<body style="margin:0;padding:0;background:#090d16;color:#f1f5f9;">
  <div id="app" style="width:100%;max-width:440px;margin:0 auto;padding:12px 12px 84px 12px;"></div>

  <script>
    const DEFAULT_REGULAR_MEMBERS = [
      '민석', '민겸', '서이', '진겸', '윤범', '민중', '주광', '동준', '미림',
      '중훈', '나윤', '재호', '한빈', '선수', '태현', '윤아', '영모'
    ];
    const DEFAULT_EXCLUDED_DEALER_FEE_MEMBERS = ['민석', '민겸', '진겸', '윤범', '한빈'];
    const ADMIN_PIN = '1234';

    const KEYS = {
      regulars: 'holic_reg_v6',
      selected: 'holic_sel_v6',
      guests: 'holic_gst_v6',
      excluded: 'holic_exc_v6'
    };

    function loadArr(key, fallback) {
      try {
        const v = JSON.parse(localStorage.getItem(key) || 'null');
        return Array.isArray(v) ? v : fallback.slice();
      } catch (e) {
        return fallback.slice();
      }
    }

    function saveArr(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    }

    const state = {
      activeTab: 'seats',
      regularMembers: loadArr(KEYS.regulars, DEFAULT_REGULAR_MEMBERS),
      guestMembers: loadArr(KEYS.guests, []),
      selectedMembers: loadArr(KEYS.selected, ['민석', '민겸', '서이', '진겸', '중훈', '나윤']),
      excludedDealerFeeMembers: loadArr(KEYS.excluded, DEFAULT_EXCLUDED_DEALER_FEE_MEMBERS),
      newRegularInput: '',
      newGuestInput: '',
      isAdminUnlocked: false,
      showAdminPinPrompt: false,
      adminPinInput: '',
      selectedDealer: '__RANDOM__',
      dealerName: '',
      seatAssignments: [],
      dealerFeeWinners: [],
      dealerFeeDone: false,
      totalPool: 0,
      roundTo100: true,
      players: [],
      lastSig: '',
      copiedText: false,
      toast: ''
    };

    function getAttendees() {
      return [...new Set([...state.selectedMembers, ...state.guestMembers])].filter(x => x && x.trim());
    }

    function getEligibleDealerFee() {
      return getAttendees().filter(n => n !== state.dealerName && !state.excludedDealerFeeMembers.includes(n));
    }

    function syncPlayers(force) {
      const att = getAttendees();
      const sig = att.join('|');
      if (!force && sig === state.lastSig && state.players.length === att.length) return;
      const map = new Map(state.players.map(p => [p.name, p]));
      state.players = att.map((name, i) => {
        const prev = map.get(name);
        return { id: prev ? prev.id : i + 1, name, loss: prev ? prev.loss : 0 };
      });
      state.lastSig = sig;
    }

    function fmt(n) {
      return (Number(n) || 0).toLocaleString('ko-KR');
    }

    function digits(v) {
      const c = String(v || '').replace(/[^0-9]/g, '');
      return c ? parseInt(c, 10) : 0;
    }

    function roundAmt(amt, r100) {
      return r100 ? Math.round(amt / 100) * 100 : Math.round(amt);
    }

    function notify(msg) {
      state.toast = msg;
      render();
      clearTimeout(window.__t);
      window.__t = setTimeout(() => { state.toast = ''; render(); }, 1900);
    }

    function persistAll() {
      saveArr(KEYS.regulars, state.regularMembers);
      saveArr(KEYS.guests, state.guestMembers);
      saveArr(KEYS.selected, state.selectedMembers);
      saveArr(KEYS.excluded, state.excludedDealerFeeMembers);
      syncPlayers(true);

      const att = getAttendees();
      if (state.selectedDealer !== '__RANDOM__' && !att.includes(state.selectedDealer)) {
        state.selectedDealer = '__RANDOM__';
      }
      if (state.seatAssignments.length > 0) {
        const seatNames = state.seatAssignments.map(s => s.name);
        const same = seatNames.length === att.length && att.every(a => seatNames.includes(a));
        if (!same) {
          state.seatAssignments = [];
          state.dealerName = '';
        }
      }
      if (state.dealerFeeWinners.length > 0) {
        const elig = getEligibleDealerFee();
        if (state.dealerFeeWinners.some(w => !elig.includes(w))) {
          state.dealerFeeWinners = [];
          state.dealerFeeDone = false;
        }
      }
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function drawSeats() {
      const att = getAttendees();
      if (att.length < 2) { notify('최소 2명 이상 선택해 주세요.'); return; }
      const dealer = (state.selectedDealer !== '__RANDOM__' && att.includes(state.selectedDealer))
        ? state.selectedDealer
        : att[Math.floor(Math.random() * att.length)];
      const others = shuffle(att.filter(n => n !== dealer));
      state.dealerName = dealer;
      state.seatAssignments = [
        { label: 'D (딜러)', name: dealer, isDealer: true },
        ...others.map((name, idx) => ({ label: (idx + 1) + '번', name, isDealer: false }))
      ];
      state.dealerFeeWinners = [];
      state.dealerFeeDone = false;
      render();
    }

    function drawDealerFee() {
      const elig = getEligibleDealerFee();
      if (elig.length < 2) { notify('딜러 및 고정 제외 외 2명 이상 필요합니다.'); return; }
      state.dealerFeeWinners = shuffle(elig).slice(0, 2);
      state.dealerFeeDone = true;
      render();
    }

    function calcManjing() {
      const pool = Math.max(0, Number(state.totalPool) || 0);
      const list = state.players.map(p => ({ ...p, loss: Math.max(0, Number(p.loss) || 0) }));
      const totalLoss = list.reduce((s, p) => s + p.loss, 0);
      if (totalLoss <= 0) {
        return { pool, totalLoss: 0, items: list.map(p => ({ ...p, ratio: 0, settled: 0, finalLoss: 0 })) };
      }
      const items = list.map(p => {
        const ratio = p.loss / totalLoss;
        const settled = roundAmt(pool * ratio, state.roundTo100);
        const finalLoss = Math.max(0, p.loss - settled);
        return { ...p, ratio, settled, finalLoss };
      });
      return { pool, totalLoss, items };
    }

    function copyKakao() {
      const { pool, totalLoss, items } = calcManjing();
      const lines = [
        '🃏 [Holic] 홀덤 맨징 정산',
        '• 총 맨징 금액: ' + fmt(pool) + '원',
        '• 총 마이너스 합계: ' + fmt(totalLoss) + '원',
        '• 반올림: ' + (state.roundTo100 ? '100원 단위' : '원 단위'),
        ''
      ];
      items.forEach((it, idx) => {
        lines.push((idx + 1) + '. ' + it.name + ' - 마이너스 ' + fmt(it.loss) + '원 (' + (it.ratio * 100).toFixed(1) + '%) → 맨징 ' + fmt(it.settled) + '원 / 최종손실 -' + fmt(it.finalLoss) + '원');
      });
      const txt = lines.join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(() => {
          state.copiedText = true;
          notify('카톡 정산 내역 복사 완료');
          setTimeout(() => { state.copiedText = false; render(); }, 1600);
        }).catch(() => notify('복사에 실패했습니다.'));
      }
    }

    function renderTable(seats) {
      if (!seats.length) {
        return '<div style="background:#0b3326;border:3px solid #2a2117;border-radius:28px;padding:24px 12px;text-align:center;margin:8px 0;">' +
          '<div style="font-size:11px;font-weight:800;color:#fcd34d;letter-spacing:1.5px;">HOLDEM TABLE</div>' +
          '<div style="font-size:13px;font-weight:800;color:#fff;margin-top:4px;">딜러를 정한 뒤 자리뽑기 실행을 눌러주세요</div>' +
          '<div style="font-size:11px;color:#a7f3d0;margin-top:3px;">딜러 다음 좌석이 1번으로 시계방향 배정됩니다</div>' +
          '</div>';
      }
      const n = seats.length;
      const chips = seats.map((s, i) => {
        const ang = -Math.PI / 2 + (2 * Math.PI * i) / n;
        const left = (50 + 35 * Math.cos(ang)).toFixed(1);
        const top = (50 + 34 * Math.sin(ang)).toFixed(1);
        const bg = s.isDealer ? '#fbbf24' : '#0f172a';
        const fg = s.isDealer ? '#060a13' : '#ffffff';
        const sub = s.isDealer ? '#060a13' : '#34d399';
        return '<div style="position:absolute;left:' + left + '%;top:' + top + '%;transform:translate(-50%,-50%);background:' + bg + ';color:' + fg + ';border:1px solid ' + (s.isDealer ? '#fef08a' : '#334155') + ';border-radius:10px;padding:5px 7px;min-width:60px;max-width:78px;text-align:center;z-index:10;">' +
          '<div style="font-size:9px;font-weight:900;color:' + sub + ';line-height:1.1;">' + s.label + '</div>' +
          '<div style="font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;">' + s.name + '</div>' +
          '</div>';
      }).join('');

      return '<div style="background:#241c14;border-radius:36px;padding:8px;margin:8px 0;">' +
        '<div style="position:relative;width:100%;height:300px;border-radius:28px;background:radial-gradient(ellipse at center,#155e47 0%,#0b3326 75%);border:1px solid rgba(52,211,153,0.25);">' +
        '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;">' +
        '<div style="font-size:10px;font-weight:800;color:#fcd34d;letter-spacing:1.5px;">HOLIC HOLDEM</div>' +
        '<div style="font-size:13px;font-weight:900;color:#fff;margin-top:2px;">딜러: ' + state.dealerName + '</div>' +
        '<div style="font-size:10px;color:#a7f3d0;margin-top:2px;">딜러 다음 → 1번 시계방향</div>' +
        '</div>' + chips + '</div></div>';
    }

    function render() {
      syncPlayers(false);
      const att = getAttendees();
      const elig = getEligibleDealerFee();
      const { pool, totalLoss, items } = calcManjing();
      const allKnown = [...new Set([...state.regularMembers, ...state.guestMembers])];

      const cardStyle = 'background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:12px;margin-bottom:10px;';
      const inputStyle = 'width:100%;height:40px;border-radius:10px;border:1px solid #334155;background:#060a13;color:#ffffff;padding:0 10px;font-size:13px;';

      const memberButtons = state.regularMembers.map(m => {
        const on = state.selectedMembers.includes(m);
        const btnBg = on ? 'rgba(16,185,129,0.22)' : '#060a13';
        const btnBd = on ? '#34d399' : '#1e293b';
        const btnFg = on ? '#a7f3d0' : '#94a3b8';
        return '<div style="position:relative;display:flex;align-items:center;">' +
          '<button type="button" data-act="toggle" data-name="' + m + '" style="width:100%;min-height:40px;padding:6px ' + (state.isAdminUnlocked ? '24px' : '8px') + ' 6px 8px;border-radius:10px;border:1px solid ' + btnBd + ';background:' + btnBg + ';color:' + btnFg + ';font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:space-between;cursor:pointer;">' +
          '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + m + '</span>' +
          '<span style="font-size:11px;font-weight:900;">' + (on ? '✓' : '+') + '</span>' +
          '</button>' +
          (state.isAdminUnlocked
            ? '<button type="button" data-act="revoke" data-name="' + m + '" style="position:absolute;right:4px;width:18px;height:18px;border-radius:999px;border:1px solid #fb7185;background:rgba(244,63,94,0.3);color:#fecdd3;font-size:11px;font-weight:900;line-height:1;cursor:pointer;">×</button>'
            : '') +
          '</div>';
      }).join('');

      let tabBody = '';
      if (state.activeTab === 'seats') {
        tabBody = '<div style="' + cardStyle + '">' +
          '<div style="font-size:14px;font-weight:900;color:#fff;">홀덤 테이블 자리뽑기</div>' +
          '<div style="font-size:11px;color:#94a3b8;margin-top:2px;">총 ' + att.length + '석 · 딜러 지정 시 딜러 제외 ' + Math.max(0, att.length - 1) + '명이 1번부터 배정</div>' +
          renderTable(state.seatAssignments) +
          '<div style="display:flex;gap:8px;margin-top:8px;">' +
          '<select id="dealerSel" style="width:126px;height:44px;border-radius:12px;border:1px solid #fbbf24;background:#060a13;color:#fde68a;font-size:12px;font-weight:900;padding:0 8px;flex-shrink:0;">' +
          '<option value="__RANDOM__"' + (state.selectedDealer === '__RANDOM__' ? ' selected' : '') + '>딜러: 랜덤</option>' +
          att.map(n => '<option value="' + n + '"' + (state.selectedDealer === n ? ' selected' : '') + '>딜러: ' + n + '</option>').join('') +
          '</select>' +
          '<button type="button" data-act="drawSeats" style="flex:1;height:44px;border-radius:12px;border:none;background:#10b981;color:#060a13;font-size:13px;font-weight:900;cursor:pointer;">🎲 자리뽑기 실행 (' + att.length + '명)</button>' +
          '</div>' +
          (state.seatAssignments.length
            ? '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px;">' +
              state.seatAssignments.map(s => '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid ' + (s.isDealer ? '#fbbf24' : '#1e293b') + ';background:' + (s.isDealer ? 'rgba(251,191,36,0.15)' : '#060a13') + ';">' +
              '<span style="font-size:11px;font-weight:900;color:' + (s.isDealer ? '#fcd34d' : '#34d399') + ';">' + s.label + '</span>' +
              '<span style="font-size:13px;font-weight:900;color:#fff;">' + s.name + '</span></div>').join('') +
              '</div>'
            : '') +
          '</div>';
      } else if (state.activeTab === 'dealerFee') {
        tabBody = '<div style="' + cardStyle + '">' +
          '<div style="font-size:14px;font-weight:900;color:#fff;">라운드 종료 딜러비 추첨</div>' +
          '<div style="font-size:11px;color:#94a3b8;margin-top:2px;margin-bottom:8px;">딜러(' + (state.dealerName || '미지정') + ') 및 고정 제외 인원 외 ' + elig.length + '명 중 랜덤 2명 당첨</div>' +
          '<div style="background:#060a13;border:1px solid #1e293b;border-radius:12px;padding:10px;font-size:12px;margin-bottom:10px;">' +
          '<div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="color:#94a3b8;">현재 딜러 (제외)</span><span style="font-weight:900;color:#fcd34d;">' + (state.dealerName || '없음') + '</span></div>' +
          '<div style="font-size:11px;color:#94a3b8;margin-bottom:4px;">고정 제외 멤버 ' + (state.isAdminUnlocked ? '(관리자 ON · 눌러서 편집)' : '(🔒 관리자에서 편집)') + '</div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;">' +
          state.excludedDealerFeeMembers.map(n => '<button type="button" data-act="toggleExc" data-name="' + n + '" style="padding:3px 9px;border-radius:999px;border:1px solid #fb7185;background:rgba(244,63,94,0.18);color:#fecdd3;font-size:11px;font-weight:800;cursor:pointer;">' + n + (state.isAdminUnlocked ? ' ×' : '') + '</button>').join('') +
          '</div>' +
          '<div style="display:flex;justify-content:space-between;border-top:1px solid #1e293b;padding-top:6px;"><span style="color:#94a3b8;">추첨 대상</span><span style="font-weight:900;color:#34d399;">' + elig.length + '명</span></div>' +
          '</div>' +
          (state.isAdminUnlocked
            ? '<div style="background:#060a13;border:1px solid #fbbf24;border-radius:12px;padding:10px;margin-bottom:10px;">' +
              '<div style="font-size:11px;font-weight:900;color:#fcd34d;margin-bottom:6px;">고정 제외 멤버 편집</div>' +
              '<div style="display:flex;flex-wrap:wrap;gap:5px;">' +
              allKnown.map(m => {
                const ex = state.excludedDealerFeeMembers.includes(m);
                return '<button type="button" data-act="toggleExc" data-name="' + m + '" style="padding:5px 8px;border-radius:8px;border:1px solid ' + (ex ? '#fb7185' : '#1e293b') + ';background:' + (ex ? 'rgba(244,63,94,0.22)' : '#0f172a') + ';color:' + (ex ? '#fecdd3' : '#94a3b8') + ';font-size:11px;font-weight:800;cursor:pointer;">' + m + (ex ? ' 제외✓' : '') + '</button>';
              }).join('') +
              '</div></div>'
            : '') +
          (state.dealerFeeDone
            ? '<div style="background:rgba(251,191,36,0.12);border:1px solid #fbbf24;border-radius:14px;padding:14px;text-align:center;">' +
              '<div style="font-size:12px;font-weight:900;color:#fcd34d;margin-bottom:8px;">추첨 완료 · 종료</div>' +
              '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px;">' +
              state.dealerFeeWinners.map((w, i) => '<div style="background:#060a13;border:1px solid #fbbf24;border-radius:10px;padding:10px;"><div style="font-size:10px;color:#fcd34d;font-weight:800;">당첨 ' + (i + 1) + '</div><div style="font-size:15px;font-weight:900;color:#fff;margin-top:2px;">' + w + '</div></div>').join('') +
              '</div>' +
              '<button type="button" data-act="resetFee" style="width:100%;height:40px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:12px;font-weight:900;cursor:pointer;">초기화</button></div>'
            : '<button type="button" data-act="drawFee" style="width:100%;height:44px;border-radius:12px;border:none;background:#fbbf24;color:#060a13;font-size:13px;font-weight:900;cursor:pointer;">🎟️ 딜러비 2명 추첨하기</button>') +
          '</div>';
      } else {
        tabBody = '<div style="' + cardStyle + '">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
          '<span style="font-size:14px;font-weight:900;color:#fcd34d;">총 맨징 금액</span>' +
          '<button type="button" data-act="toggleR100" style="padding:5px 10px;border-radius:999px;border:1px solid ' + (state.roundTo100 ? '#fbbf24' : '#334155') + ';background:' + (state.roundTo100 ? 'rgba(251,191,36,0.2)' : '#1e293b') + ';color:#fde68a;font-size:11px;font-weight:800;cursor:pointer;">' + (state.roundTo100 ? '100원 반올림 ON' : '100원 반올림 OFF') + '</button>' +
          '</div>' +
          '<input id="poolInp" type="text" inputmode="numeric" value="' + fmt(pool) + '" style="' + inputStyle + 'height:44px;text-align:right;font-size:17px;font-weight:900;margin-bottom:8px;" />' +
          '<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px;">' +
          '<button type="button" data-act="addPool" data-amt="10000" style="height:36px;border-radius:8px;border:none;background:#1e293b;color:#e2e8f0;font-size:12px;font-weight:800;cursor:pointer;">+1만</button>' +
          '<button type="button" data-act="addPool" data-amt="50000" style="height:36px;border-radius:8px;border:none;background:#1e293b;color:#e2e8f0;font-size:12px;font-weight:800;cursor:pointer;">+5만</button>' +
          '<button type="button" data-act="addPool" data-amt="100000" style="height:36px;border-radius:8px;border:none;background:#1e293b;color:#e2e8f0;font-size:12px;font-weight:800;cursor:pointer;">+10만</button>' +
          '<button type="button" data-act="resetPool" style="height:36px;border-radius:8px;border:1px solid #fb7185;background:rgba(136,19,55,0.5);color:#fecdd3;font-size:12px;font-weight:800;cursor:pointer;">초기화</button>' +
          '</div>' +
          '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;"><span style="font-weight:900;color:#fff;">참여 멤버 (' + items.length + '명)</span><span style="color:#94a3b8;">총 마이너스 <strong style="color:#fda4af;">' + fmt(totalLoss) + '원</strong></span></div>' +
          items.map((it, idx) =>
            '<div style="background:#060a13;border:1px solid #1e293b;border-radius:12px;padding:10px;margin-bottom:8px;">' +
            '<div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="font-size:13px;font-weight:900;color:#fff;">' + (idx + 1) + '. ' + it.name + '</span><span style="font-size:11px;font-weight:800;color:#94a3b8;">' + (it.ratio * 100).toFixed(1) + '%</span></div>' +
            '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;">' +
            '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:8px;display:flex;flex-direction:column;justify-content:center;">' +
            '<div style="font-size:11px;font-weight:800;color:#fda4af;margin-bottom:4px;">마이너스 금액</div>' +
            '<input type="text" inputmode="numeric" data-loss-id="' + it.id + '" value="' + fmt(it.loss) + '" style="' + inputStyle + 'height:38px;text-align:right;font-size:14px;font-weight:900;" />' +
            '</div>' +
            '<div style="display:flex;flex-direction:column;gap:6px;">' +
            '<div style="background:rgba(16,185,129,0.14);border:1px solid rgba(52,211,153,0.4);border-radius:10px;padding:8px;display:flex;justify-content:space-between;align-items:center;"><span style="font-size:11px;font-weight:800;color:#6ee7b7;">맨징 금액</span><span style="font-size:13px;font-weight:900;color:#6ee7b7;">+' + fmt(it.settled) + '원</span></div>' +
            '<div style="background:rgba(244,63,94,0.14);border:1px solid rgba(251,113,133,0.4);border-radius:10px;padding:8px;display:flex;justify-content:space-between;align-items:center;"><span style="font-size:11px;font-weight:800;color:#fda4af;">최종 손실</span><span style="font-size:13px;font-weight:900;color:#fda4af;">-' + fmt(it.finalLoss) + '원</span></div>' +
            '</div></div></div>'
          ).join('') +
          '<button type="button" data-act="copyKakao" style="width:100%;height:44px;border-radius:12px;border:none;background:#fbbf24;color:#060a13;font-size:13px;font-weight:900;cursor:pointer;margin-top:4px;">' + (state.copiedText ? '✓ 복사 완료' : '💬 카톡 내역 복사') + '</button>' +
          '</div>';
      }

      document.getElementById('app').innerHTML =
        (state.toast ? '<div style="position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:99;background:#1e293b;color:#fde047;border:1px solid #fbbf24;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:800;">' + state.toast + '</div>' : '') +
        '<div style="' + cardStyle + 'display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;">' +
        '<div style="display:flex;align-items:center;gap:10px;min-width:0;">' +
        '<img src="icon.png" alt="Holic" onerror="this.style.display=\'none\'" style="width:42px;height:42px;border-radius:10px;object-fit:cover;border:1px solid #fbbf24;flex-shrink:0;" />' +
        '<div style="min-width:0;"><div style="font-size:15px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Holic 홀덤 매니저</div><div style="font-size:11px;color:#94a3b8;">멤버 체크 후 탭으로 진행</div></div>' +
        '</div>' +
        '<span style="background:rgba(16,185,129,0.2);color:#6ee7b7;border:1px solid #34d399;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:900;white-space:nowrap;">' + att.length + '명 참석</span>' +
        '</div>' +
        '<div style="' + cardStyle + '">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px;">' +
        '<span style="font-size:14px;font-weight:900;color:#fff;">오늘 참석 멤버</span>' +
        '<div style="display:flex;gap:5px;">' +
        '<button type="button" data-act="allSel" style="padding:5px 8px;border-radius:8px;border:none;background:#1e293b;color:#6ee7b7;font-size:11px;font-weight:800;cursor:pointer;">전체선택</button>' +
        '<button type="button" data-act="clrSel" style="padding:5px 8px;border-radius:8px;border:none;background:#1e293b;color:#cbd5e1;font-size:11px;font-weight:800;cursor:pointer;">해제</button>' +
        '<button type="button" data-act="admToggle" style="padding:5px 8px;border-radius:8px;border:1px solid #fbbf24;background:' + (state.isAdminUnlocked ? 'rgba(244,63,94,0.25)' : '#060a13') + ';color:#fde68a;font-size:11px;font-weight:800;cursor:pointer;">' + (state.isAdminUnlocked ? '관리자 ON' : '🔒 관리자') + '</button>' +
        '</div></div>' +
        (state.showAdminPinPrompt && !state.isAdminUnlocked
          ? '<div style="display:flex;gap:6px;margin-bottom:8px;"><input id="pinInp" type="password" inputmode="numeric" value="' + state.adminPinInput + '" placeholder="관리자 PIN (1234)" style="' + inputStyle + 'height:36px;flex:1;" /><button type="button" data-act="pinOk" style="height:36px;padding:0 12px;border-radius:8px;border:none;background:#fbbf24;color:#060a13;font-size:12px;font-weight:900;cursor:pointer;">확인</button></div>'
          : '') +
        '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;">' +
        (att.length ? att.map(n => '<span style="padding:3px 9px;border-radius:999px;background:rgba(16,185,129,0.18);color:#a7f3d0;border:1px solid #34d399;font-size:11px;font-weight:800;">' + n + '</span>').join('') : '<span style="font-size:11px;color:#64748b;">참석 멤버를 터치하세요.</span>') +
        '</div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px;">' + memberButtons + '</div>' +
        (state.guestMembers.length
          ? '<div style="margin-bottom:8px;"><div style="font-size:11px;font-weight:800;color:#fcd34d;margin-bottom:4px;">추가 참가자</div><div style="display:flex;flex-wrap:wrap;gap:5px;">' +
            state.guestMembers.map(g => '<button type="button" data-act="toggle" data-name="' + g + '" style="padding:4px 9px;border-radius:999px;border:1px solid #fbbf24;background:rgba(251,191,36,0.2);color:#fde68a;font-size:11px;font-weight:800;cursor:pointer;">' + g + ' ×</button>').join('') +
            '</div></div>'
          : '') +
        '<div style="display:flex;flex-direction:column;gap:6px;border-top:1px solid #1e293b;padding-top:8px;">' +
        '<div style="display:flex;gap:6px;"><input id="regInp" type="text" value="' + state.newRegularInput + '" placeholder="단골 멤버 이름 추가" style="' + inputStyle + 'flex:1;" /><button type="button" data-act="addReg" style="height:40px;padding:0 12px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#6ee7b7;font-size:12px;font-weight:900;white-space:nowrap;cursor:pointer;">단골등록</button></div>' +
        '<div style="display:flex;gap:6px;"><input id="gstInp" type="text" value="' + state.newGuestInput + '" placeholder="처음 온 추가 참가자 입력" style="' + inputStyle + 'flex:1;" /><button type="button" data-act="addGst" style="height:40px;padding:0 12px;border-radius:10px;border:none;background:#fbbf24;color:#060a13;font-size:12px;font-weight:900;white-space:nowrap;cursor:pointer;">참가추가</button></div>' +
        '</div></div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:#0f172a;border:1px solid #1e293b;border-radius:14px;padding:5px;margin-bottom:10px;">' +
        '<button type="button" data-act="tab" data-tab="seats" style="height:40px;border-radius:10px;border:none;background:' + (state.activeTab === 'seats' ? '#10b981' : 'transparent') + ';color:' + (state.activeTab === 'seats' ? '#060a13' : '#e2e8f0') + ';font-size:12px;font-weight:900;cursor:pointer;">🪑 자리뽑기</button>' +
        '<button type="button" data-act="tab" data-tab="dealerFee" style="height:40px;border-radius:10px;border:none;background:' + (state.activeTab === 'dealerFee' ? '#fbbf24' : 'transparent') + ';color:' + (state.activeTab === 'dealerFee' ? '#060a13' : '#e2e8f0') + ';font-size:12px;font-weight:900;cursor:pointer;">🎟️ 딜러비</button>' +
        '<button type="button" data-act="tab" data-tab="manjing" style="height:40px;border-radius:10px;border:none;background:' + (state.activeTab === 'manjing' ? '#10b981' : 'transparent') + ';color:' + (state.activeTab === 'manjing' ? '#060a13' : '#e2e8f0') + ';font-size:12px;font-weight:900;cursor:pointer;">💰 맨징</button>' +
        '</div>' +
        tabBody;

      bind();
    }

    function bind() {
      const regInp = document.getElementById('regInp');
      if (regInp) regInp.oninput = e => { state.newRegularInput = e.target.value; };
      const gstInp = document.getElementById('gstInp');
      if (gstInp) gstInp.oninput = e => { state.newGuestInput = e.target.value; };
      const pinInp = document.getElementById('pinInp');
      if (pinInp) pinInp.oninput = e => { state.adminPinInput = e.target.value; };
      const dealerSel = document.getElementById('dealerSel');
      if (dealerSel) dealerSel.onchange = e => { state.selectedDealer = e.target.value; };
      const poolInp = document.getElementById('poolInp');
      if (poolInp) {
        poolInp.oninput = e => { const v = digits(e.target.value); state.totalPool = v; e.target.value = fmt(v); };
        poolInp.onblur = () => render();
      }
      document.querySelectorAll('[data-loss-id]').forEach(inp => {
        inp.oninput = e => {
          const id = Number(e.target.getAttribute('data-loss-id'));
          const v = digits(e.target.value);
          state.players = state.players.map(p => p.id === id ? { ...p, loss: v } : p);
          e.target.value = fmt(v);
        };
        inp.onblur = () => render();
      });
      document.querySelectorAll('[data-act]').forEach(el => {
        el.onclick = () => {
          const act = el.getAttribute('data-act');
          const name = el.getAttribute('data-name');
          if (act === 'toggle') {
            if (state.guestMembers.includes(name)) state.guestMembers = state.guestMembers.filter(g => g !== name);
            else if (state.selectedMembers.includes(name)) state.selectedMembers = state.selectedMembers.filter(m => m !== name);
            else state.selectedMembers = [...state.selectedMembers, name];
            persistAll(); render();
          } else if (act === 'allSel') {
            state.selectedMembers = state.regularMembers.slice(); persistAll(); render();
          } else if (act === 'clrSel') {
            state.selectedMembers = []; state.guestMembers = []; persistAll(); render();
          } else if (act === 'admToggle') {
            if (state.isAdminUnlocked) { state.isAdminUnlocked = false; state.showAdminPinPrompt = false; notify('관리자 모드 종료'); }
            else { state.showAdminPinPrompt = !state.showAdminPinPrompt; render(); }
          } else if (act === 'pinOk') {
            if (state.adminPinInput.trim() === ADMIN_PIN) { state.isAdminUnlocked = true; state.showAdminPinPrompt = false; state.adminPinInput = ''; notify('관리자 모드 ON'); }
            else { state.adminPinInput = ''; notify('PIN이 일치하지 않습니다.'); }
          } else if (act === 'revoke') {
            if (!state.isAdminUnlocked) { state.showAdminPinPrompt = true; notify('관리자 인증 후 해지 가능합니다.'); return; }
            state.regularMembers = state.regularMembers.filter(m => m !== name);
            state.selectedMembers = state.selectedMembers.filter(m => m !== name);
            state.excludedDealerFeeMembers = state.excludedDealerFeeMembers.filter(m => m !== name);
            persistAll(); notify("'" + name + "' 해지 완료");
          } else if (act === 'toggleExc') {
            if (!state.isAdminUnlocked) { state.showAdminPinPrompt = true; notify('관리자 모드에서 편집 가능합니다.'); return; }
            if (state.excludedDealerFeeMembers.includes(name)) state.excludedDealerFeeMembers = state.excludedDealerFeeMembers.filter(m => m !== name);
            else state.excludedDealerFeeMembers = [...state.excludedDealerFeeMembers, name];
            persistAll(); render();
          } else if (act === 'addReg') {
            const t = state.newRegularInput.trim(); if (!t) return;
            if (!state.regularMembers.includes(t)) state.regularMembers = [...state.regularMembers, t];
            state.selectedMembers = [...new Set([...state.selectedMembers, t])];
            state.newRegularInput = ''; persistAll(); notify("'" + t + "' 단골 추가 완료");
          } else if (act === 'addGst') {
            const t = state.newGuestInput.trim(); if (!t) return;
            if (!state.regularMembers.includes(t) && !state.guestMembers.includes(t)) state.guestMembers = [...state.guestMembers, t];
            state.newGuestInput = ''; persistAll(); notify("'" + t + "' 참가 추가 완료");
          } else if (act === 'tab') {
            state.activeTab = el.getAttribute('data-tab'); render();
          } else if (act === 'drawSeats') {
            drawSeats();
          } else if (act === 'drawFee') {
            drawDealerFee();
          } else if (act === 'resetFee') {
            state.dealerFeeWinners = []; state.dealerFeeDone = false; render();
          } else if (act === 'toggleR100') {
            state.roundTo100 = !state.roundTo100; render();
          } else if (act === 'addPool') {
            state.totalPool = (Number(state.totalPool) || 0) + (Number(el.getAttribute('data-amt')) || 0); render();
          } else if (act === 'resetPool') {
            state.totalPool = 0; state.players = state.players.map(p => ({ ...p, loss: 0 })); render();
          } else if (act === 'copyKakao') {
            copyKakao();
          }
        };
      });
    }

    render();
  </script>
</body>
</html>
