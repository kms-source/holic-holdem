<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Holic 홀덤 매니저</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .app-shell {
      width: 100%;
      max-width: 448px;
      margin: 0 auto;
      padding: 14px 14px 88px;
    }
    .card-box {
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 10px 14px;
      margin-bottom: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .header-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid rgba(251, 191, 36, 0.45);
      flex-shrink: 0;
    }
    .badge-count {
      background: rgba(16, 185, 129, 0.18);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .member-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .member-btn {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid #1e293b;
      background: #060a13;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .member-btn.active {
      background: rgba(16, 185, 129, 0.2);
      border-color: #34d399;
      color: #a7f3d0;
    }
    .member-btn.has-revoke {
      padding-right: 26px;
    }
    .revoke-x {
      position: absolute;
      right: 5px;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: 1px solid rgba(251, 113, 133, 0.45);
      background: rgba(244, 63, 94, 0.25);
      color: #fda4af;
      font-size: 12px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .tab-nav {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 6px;
      border-radius: 18px;
      margin-bottom: 12px;
      position: sticky;
      top: 8px;
      z-index: 30;
    }
    .tab-btn {
      height: 44px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .tab-btn.active-emerald {
      background: #10b981;
      color: #060a13;
    }
    .tab-btn.active-amber {
      background: #fbbf24;
      color: #060a13;
    }
    .table-rail {
      background: linear-gradient(145deg, #2d2419 0%, #17130f 55%, #261e15 100%);
      border-radius: 38px;
      padding: 10px;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(251, 191, 36, 0.3);
    }
    .felt-surface {
      position: relative;
      width: 100%;
      height: 320px;
      border-radius: 30px;
      border: 1px solid rgba(52, 211, 153, 0.25);
      background: radial-gradient(ellipse at center, #155e47 0%, #0d3b2c 68%, #072219 100%);
      box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.7);
    }
    .seat-chip {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 64px;
      max-width: 82px;
      border-radius: 12px;
      padding: 6px 8px;
      text-align: center;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      color: #f8fafc;
      z-index: 10;
    }
    .seat-chip.dealer {
      background: #fbbf24;
      border-color: #fde68a;
      color: #060a13;
      box-shadow: 0 0 0 2px rgba(252, 211, 77, 0.45);
    }
    .manjing-split {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-items: stretch;
    }
    .manjing-right-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-dark {
      width: 100%;
      height: 42px;
      border-radius: 12px;
      border: 1px solid #1e293b;
      background: #060a13;
      color: #ffffff;
      padding: 0 12px;
      font-size: 13px;
      outline: none;
    }
    .btn-primary-emerald {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(90deg, #10b981, #2dd4bf);
      color: #060a13;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-amber {
      height: 46px;
      border: none;
      border-radius: 16px;
      background: #fbbf24;
      color: #060a13;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }
    .toast-banner {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      background: #1e293b;
      color: #fde047;
      border: 1px solid rgba(250, 204, 21, 0.45);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell"></div>

  <script>
    const DEFAULT_REGULAR_MEMBERS = [
      '민석', '민겸', '서이', '진겸', '윤범', '민중', '주광', '동준', '미림',
      '중훈', '나윤', '재호', '한빈', '선수', '태현', '윤아', '영모'
    ];

    const DEFAULT_EXCLUDED_DEALER_FEE_MEMBERS = [
      '민석', '민겸', '진겸', '윤범', '한빈'
    ];

    const ADMIN_PIN = '1234';

    const STORAGE_KEYS = {
      regulars: 'holic_regular_members_v5',
      selected: 'holic_selected_members_v5',
      guests: 'holic_guest_members_v5',
      excludedDealerFee: 'holic_excluded_dealer_fee_v5'
    };

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        const parsed = raw ? JSON.parse(raw) : fallback;
        return Array.isArray(parsed) ? parsed : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveJSON(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {}
    }

    const state = {
      activeTab: 'seats',
      regularMembers: loadJSON(STORAGE_KEYS.regulars, DEFAULT_REGULAR_MEMBERS),
      guestMembers: loadJSON(STORAGE_KEYS.guests, []),
      selectedMembers: loadJSON(STORAGE_KEYS.selected, ['민석', '민겸', '서이', '진겸', '중훈', '나윤']),
      excludedDealerFeeMembers: loadJSON(STORAGE_KEYS.excludedDealerFee, DEFAULT_EXCLUDED_DEALER_FEE_MEMBERS),
      newRegularInput: '',
      newGuestInput: '',
      isAdminUnlocked: false,
      showAdminPinPrompt: false,
      adminPinInput: '',
      selectedDealer: '__RANDOM__',
      dealerName: '',
      seatAssignments: [],
      dealerFeeWinners: [],
      dealerFeeDone: false,
      totalPool: 0,
      roundTo100: true,
      players: [],
      lastSyncedSignature: '',
      copiedText: false,
      exportingImage: false,
      statusMessage: ''
    };

    function getAllAttendees() {
      const combined = [...state.selectedMembers, ...state.guestMembers];
      return [...new Set(combined)].filter(name => typeof name === 'string' && name.trim().length > 0);
    }

    function getEligibleDealerFeeAttendees() {
      const attendees = getAllAttendees();
      return attendees.filter(
        name => name !== state.dealerName && !state.excludedDealerFeeMembers.includes(name)
      );
    }

    function syncManjingPlayers(force = false) {
      const attendees = getAllAttendees();
      const signature = attendees.join('|');
      if (!force && signature === state.lastSyncedSignature && state.players.length === attendees.length) {
        return;
      }
      const existingMap = new Map(state.players.map(p => [p.name, p]));
      state.players = attendees.map((name, idx) => {
        const prev = existingMap.get(name);
        return {
          id: prev ? prev.id : idx + 1,
          name,
          loss: prev ? prev.loss : 0
        };
      });
      state.lastSyncedSignature = signature;
    }

    function formatNumber(num) {
      const n = Number(num) || 0;
      return n.toLocaleString('ko-KR');
    }

    function parseDigits(val) {
      const cleaned = String(val || '').replace(/[^0-9]/g, '');
      return cleaned ? parseInt(cleaned, 10) : 0;
    }

    function roundSettlement(amount, roundTo100) {
      if (!roundTo100) return Math.round(amount);
      return Math.round(amount / 100) * 100;
    }

    function showToast(msg) {
      state.statusMessage = msg;
      render();
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        state.statusMessage = '';
        render();
      }, 2000);
    }

    function persistMemberState() {
      saveJSON(STORAGE_KEYS.regulars, state.regularMembers);
      saveJSON(STORAGE_KEYS.guests, state.guestMembers);
      saveJSON(STORAGE_KEYS.selected, state.selectedMembers);
      saveJSON(STORAGE_KEYS.excludedDealerFee, state.excludedDealerFeeMembers);
      syncManjingPlayers(true);

      const attendees = getAllAttendees();
      if (state.selectedDealer !== '__RANDOM__' && !attendees.includes(state.selectedDealer)) {
        state.selectedDealer = '__RANDOM__';
      }
      if (state.seatAssignments.length > 0) {
        const currentSeatNames = state.seatAssignments.map(s => s.name);
        const sameSet =
          currentSeatNames.length === attendees.length &&
          attendees.every(a => currentSeatNames.includes(a));
        if (!sameSet) {
          state.seatAssignments = [];
          state.dealerName = '';
        }
      }
      if (state.dealerFeeWinners.length > 0) {
        const eligible = getEligibleDealerFeeAttendees();
        const invalidWinner = state.dealerFeeWinners.some(w => !eligible.includes(w));
        if (invalidWinner) {
          state.dealerFeeWinners = [];
          state.dealerFeeDone = false;
        }
      }
    }

    function toggleDealerFeeExclusion(name) {
      if (!state.isAdminUnlocked) {
        state.showAdminPinPrompt = true;
        showToast('관리자 모드에서 고정 제외 멤버를 편집할 수 있습니다.');
        return;
      }
      if (state.excludedDealerFeeMembers.includes(name)) {
        state.excludedDealerFeeMembers = state.excludedDealerFeeMembers.filter(m => m !== name);
        showToast(`'${name}' 고정 제외 해제`);
      } else {
        state.excludedDealerFeeMembers = [...state.excludedDealerFeeMembers, name];
        showToast(`'${name}' 고정 제외 추가`);
      }
      persistMemberState();
      render();
    }

    function toggleAttendee(name) {
      if (state.guestMembers.includes(name)) {
        state.guestMembers = state.guestMembers.filter(g => g !== name);
      } else if (state.selectedMembers.includes(name)) {
        state.selectedMembers = state.selectedMembers.filter(m => m !== name);
      } else {
        state.selectedMembers = [...state.selectedMembers, name];
      }
      persistMemberState();
      render();
    }

    function addRegularMember() {
      const trimmed = state.newRegularInput.trim();
      if (!trimmed) return;
      if (state.regularMembers.includes(trimmed)) {
        showToast('이미 단골 멤버에 있습니다.');
        return;
      }
      state.regularMembers = [...state.regularMembers, trimmed];
      state.selectedMembers = [...new Set([...state.selectedMembers, trimmed])];
      state.newRegularInput = '';
      persistMemberState();
      showToast(`'${trimmed}' 단골 추가 완료`);
    }

    function revokeRegularMember(name) {
      if (!state.isAdminUnlocked) {
        state.showAdminPinPrompt = true;
        showToast('관리자 인증 후 해지할 수 있습니다.');
        return;
      }
      state.regularMembers = state.regularMembers.filter(m => m !== name);
      state.selectedMembers = state.selectedMembers.filter(m => m !== name);
      state.excludedDealerFeeMembers = state.excludedDealerFeeMembers.filter(m => m !== name);
      persistMemberState();
      showToast(`단골 '${name}' 해지 완료`);
    }

    function verifyAdminPin() {
      if (state.adminPinInput.trim() === ADMIN_PIN) {
        state.isAdminUnlocked = true;
        state.showAdminPinPrompt = false;
        state.adminPinInput = '';
        showToast('관리자 모드 ON');
      } else {
        state.adminPinInput = '';
        showToast('PIN이 일치하지 않습니다.');
      }
    }

    function addGuestMember() {
      const trimmed = state.newGuestInput.trim();
      if (!trimmed) return;
      const allKnown = [...state.regularMembers, ...state.guestMembers];
      if (allKnown.includes(trimmed)) {
        if (!state.selectedMembers.includes(trimmed) && state.regularMembers.includes(trimmed)) {
          state.selectedMembers = [...state.selectedMembers, trimmed];
          persistMemberState();
          showToast(`'${trimmed}' 참석 체크 완료`);
          return;
        }
        showToast('이미 참가자 목록에 있습니다.');
        return;
      }
      state.guestMembers = [...state.guestMembers, trimmed];
      state.newGuestInput = '';
      persistMemberState();
      showToast(`추가 참가자 '${trimmed}' 등록 완료`);
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function drawSeats() {
      const attendees = getAllAttendees();
      if (attendees.length < 2) {
        showToast('최소 2명 이상 체크해 주세요.');
        return;
      }
      const chosenDealer =
        state.selectedDealer !== '__RANDOM__' && attendees.includes(state.selectedDealer)
          ? state.selectedDealer
          : attendees[Math.floor(Math.random() * attendees.length)];

      const remainingPlayers = shuffleArray(attendees.filter(name => name !== chosenDealer));
      state.dealerName = chosenDealer;
      state.seatAssignments = [
        { seatNumber: 0, seatLabel: 'D (딜러)', name: chosenDealer, isDealer: true },
        ...remainingPlayers.map((name, idx) => ({
          seatNumber: idx + 1,
          seatLabel: `${idx + 1}번`,
          name,
          isDealer: false
        }))
      ];
      state.dealerFeeWinners = [];
      state.dealerFeeDone = false;
      render();
    }

    function drawDealerFeeWinners() {
      const eligible = getEligibleDealerFeeAttendees();
      if (eligible.length < 2) {
        showToast('딜러 및 고정 제외 인원 외 2명 이상 필요합니다.');
        return;
      }
      state.dealerFeeWinners = shuffleArray(eligible).slice(0, 2);
      state.dealerFeeDone = true;
      render();
    }

    function resetDealerFeeRound() {
      state.dealerFeeWinners = [];
      state.dealerFeeDone = false;
      render();
    }

    function calculateManjing() {
      const pool = Math.max(0, Number(state.totalPool) || 0);
      const validPlayers = state.players.map(p => ({
        ...p,
        loss: Math.max(0, Number(p.loss) || 0)
      }));
      const totalLoss = validPlayers.reduce((sum, p) => sum + p.loss, 0);

      if (totalLoss <= 0) {
        return {
          pool,
          totalLoss: 0,
          items: validPlayers.map(p => ({
            ...p,
            ratio: 0,
            exactAmount: 0,
            settledAmount: 0,
            finalLoss: 0
          }))
        };
      }

      const items = validPlayers.map(p => {
        const ratio = p.loss / totalLoss;
        const exactAmount = pool * ratio;
        const settledAmount = roundSettlement(exactAmount, state.roundTo100);
        const finalLoss = Math.max(0, p.loss - settledAmount);
        return { ...p, ratio, exactAmount, settledAmount, finalLoss };
      });

      return { pool, totalLoss, items };
    }

    function buildKakaoText() {
      const { pool, totalLoss, items } = calculateManjing();
      const lines = [
        '🃏 [Holic] 홀덤 맨징 정산',
        `• 총 맨징 금액: ${formatNumber(pool)}원`,
        `• 총 마이너스 합계: ${formatNumber(totalLoss)}원`,
        `• 반올림 기준: ${state.roundTo100 ? '100원 단위' : '원 단위'}`,
        ''
      ];
      items.forEach((item, index) => {
        const pct = (item.ratio * 100).toFixed(1);
        lines.push(
          `${index + 1}. ${item.name} — 마이너스 ${formatNumber(item.loss)}원 (${pct}%) → 맨징 ${formatNumber(item.settledAmount)}원 / 최종손실 -${formatNumber(item.finalLoss)}원`
        );
      });
      return lines.join('\n');
    }

    async function copySettlementText() {
      const text = buildKakaoText();
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        state.copiedText = true;
        render();
        showToast('카톡 정산 내역 복사 완료');
        setTimeout(() => {
          state.copiedText = false;
          render();
        }, 1800);
      } catch (e) {
        showToast('복사에 실패했습니다.');
      }
    }

    function exportSettlementPng() {
      state.exportingImage = true;
      render();

      const { pool, totalLoss, items } = calculateManjing();
      const width = 920;
      const rowHeight = 82;
      const height = 260 + Math.max(items.length, 1) * rowHeight;

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, width, height);
      bgGrad.addColorStop(0, '#090d16');
      bgGrad.addColorStop(1, '#111827');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = 'rgba(245, 158, 11, 0.35)';
      ctx.lineWidth = 3;
      ctx.strokeRect(24, 24, width - 48, height - 48);

      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 34px sans-serif';
      ctx.fillText('Holic 홀덤 맨징 정산표', 56, 86);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '22px sans-serif';
      ctx.fillText(
        `총 맨징: ${formatNumber(pool)}원   |   총 마이너스: ${formatNumber(totalLoss)}원   |   ${state.roundTo100 ? '100원 반올림' : '원 단위'}`,
        56,
        132
      );

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(56, 162);
      ctx.lineTo(width - 56, 162);
      ctx.stroke();

      items.forEach((item, idx) => {
        const y = 212 + idx * rowHeight;
        ctx.fillStyle = 'rgba(30, 41, 59, 0.72)';
        ctx.fillRect(56, y - 34, width - 112, 64);

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 23px sans-serif';
        ctx.fillText(`${idx + 1}. ${item.name}`, 76, y - 2);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '19px sans-serif';
        ctx.fillText(`-${formatNumber(item.loss)}원 (${(item.ratio * 100).toFixed(1)}%)`, 275, y - 2);

        ctx.fillStyle = '#34d399';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`+${formatNumber(item.settledAmount)}원`, width - 76, y - 4);

        ctx.fillStyle = '#fda4af';
        ctx.font = 'bold 17px sans-serif';
        ctx.fillText(`최종손실 -${formatNumber(item.finalLoss)}원`, width - 76, y + 20);
        ctx.textAlign = 'left';
      });

      const link = document.createElement('a');
      link.download = `holic-manjing-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();

      state.exportingImage = false;
      render();
      showToast('PNG 이미지 저장 완료');
    }

    function renderPokerTable(assignments) {
      const count = assignments.length;
      if (count === 0) {
        return `
          <div class="table-rail" style="margin: 8px 0;">
            <div class="felt-surface" style="height: 170px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; text-align:center;">
              <div style="font-size:11px; font-weight:800; letter-spacing:0.15em; color:#fcd34d;">HOLDEM TABLE</div>
              <div style="font-size:14px; font-weight:800; color:#ffffff; margin-top:4px;">딜러를 정한 뒤 자리뽑기 실행을 눌러주세요</div>

      if (regInput) {
        regInput.addEventListener('input', e => { state.newRegularInput = e.target.value; });
        regInput.addEventListener('keydown', e => { if (e.key === 'Enter') addRegularMember(); });
      }

      const guestInput = document.getElementById('newGuestInput');
      if (guestInput) {
        guestInput.addEventListener('input', e => { state.newGuestInput = e.target.value; });
        guestInput.addEventListener('keydown', e => { if (e.key === 'Enter') addGuestMember(); });
      }

      const pinInput = document.getElementById('adminPinInput');
      if (pinInput) {
        pinInput.addEventListener('input', e => { state.adminPinInput = e.target.value; });
        pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') verifyAdminPin(); });
      }

      const dealerSelect = document.getElementById('dealerSelectInline');
      if (dealerSelect) {
        dealerSelect.addEventListener('change', e => { state.selectedDealer = e.target.value; });
      }

      const poolInput = document.getElementById('totalPoolInput');
      if (poolInput) {
        poolInput.addEventListener('input', e => {
          const val = parseDigits(e.target.value);
          state.totalPool = val;
          e.target.value = formatNumber(val);
        });
        poolInput.addEventListener('blur', () => render());
      }

      document.querySelectorAll('[data-player-loss-id]').forEach(input => {
        input.addEventListener('input', e => {
          const id = Number(e.target.getAttribute('data-player-loss-id'));
          const val = parseDigits(e.target.value);
          state.players = state.players.map(p => (p.id === id ? { ...p, loss: val } : p));
          e.target.value = formatNumber(val);
        });
        input.addEventListener('blur', () => render());
      });

      document.querySelectorAll('[data-action]').forEach(el => {
        el.addEventListener('click', () => {
          const action = el.getAttribute('data-action');
          if (action === 'toggle-member') {
            toggleAttendee(el.getAttribute('data-name'));
          } else if (action === 'select-all-regulars') {
            state.selectedMembers = [...state.regularMembers];
            persistMemberState();
            render();
          } else if (action === 'clear-selection') {
            state.selectedMembers = [];
            state.guestMembers = [];
            persistMemberState();
            render();
          } else if (action === 'toggle-admin-lock') {
            if (state.isAdminUnlocked) {
              state.isAdminUnlocked = false;
              state.showAdminPinPrompt = false;
              showToast('관리자 모드 종료');
            } else {
              state.showAdminPinPrompt = !state.showAdminPinPrompt;
              render();
            }
          } else if (action === 'verify-admin-pin') {
            verifyAdminPin();
          } else if (action === 'revoke-regular') {
            revokeRegularMember(el.getAttribute('data-name'));
          } else if (action === 'toggle-dealer-fee-exclude') {
            toggleDealerFeeExclusion(el.getAttribute('data-name'));
          } else if (action === 'add-regular') {
            addRegularMember();
          } else if (action === 'add-guest') {
            addGuestMember();
          } else if (action === 'switch-tab') {
            state.activeTab = el.getAttribute('data-tab');
            render();
          } else if (action === 'draw-seats') {
            drawSeats();
          } else if (action === 'draw-dealer-fee') {
            drawDealerFeeWinners();
          } else if (action === 'reset-dealer-fee') {
            resetDealerFeeRound();
          } else if (action === 'toggle-round100') {
            state.roundTo100 = !state.roundTo100;
            render();
          } else if (action === 'add-pool') {
            const amount = Number(el.getAttribute('data-amount')) || 0;
            state.totalPool = (Number(state.totalPool) || 0) + amount;
            render();
          } else if (action === 'reset-pool') {
            state.totalPool = 0;
            state.players = state.players.map(p => ({ ...p, loss: 0 }));
            render();
          } else if (action === 'copy-kakao') {
            copySettlementText();
          } else if (action === 'export-png') {
            exportSettlementPng();
          }
        });
      });
    }

    render();
  </script>
</body>
</html>
